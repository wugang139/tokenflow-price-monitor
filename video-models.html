  --text: #e6edf3;
  --text-dim: #7d8590;
  --text-muted: #484f58;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --orange: #db6d28;
  --purple: #bc8cff;
  --pink: #f778ba;
  --teal: #39d0d8;
  --gold: #e3b341;
  --cn-domestic: #f85149;
  --intl: #58a6ff;

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {

  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 100px;
}
/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,17,23,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 10px;
}
.header h1 {
  font-size: 18px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}
.header h1 .emoji { font-size: 20px; }
.header .subtitle { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.header .meta {

  margin-top: 6px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.header .meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
.header .meta .badge {
  padding: 2px 8px; border-radius: 10px;
  background: var(--card); border: 1px solid var(--border);
  font-size: 10px; font-weight: 600;
}
.header .meta .badge.cn { color: var(--cn-domestic); border-color: var(--cn-domestic); }
.header .meta .badge.intl { color: var(--intl); border-color: var(--intl); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Change banner */
.change-banner {
  margin: 8px 12px;
  padding: 10px 12px;
  background: var(--changed-bg);
  border: 1px solid var(--changed-border);
  border-radius: 10px;
}
.change-banner .cb-title { font-size: 13px; font-weight: 700; color: var(--changed); }
.change-banner .cb-detail { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.6; }

/* Billing note card */
.note-card {
  margin: 8px 12px;
  padding: 10px 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.6;
}
.note-card .note-title { color: var(--gold); font-weight: 700; margin-bottom: 4px; font-size: 12px; }
.note-card ul { list-style: none; padding-left: 0; }
.note-card li { padding: 2px 0; padding-left: 14px; position: relative; }
.note-card li::before { content: "•"; position: absolute; left: 4px; color: var(--text-muted); }
.note-card li.warn { color: var(--red); }
.note-card li.warn::before { content: "⚠"; }

/* Tabs */
.tabs {
  display: flex; gap: 6px; padding: 8px 12px 4px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 6px 12px; border-radius: 16px;
  font-size: 12px; font-weight: 600;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer; transition: all 0.2s;
}
.tab.active {
  background: var(--accent); border-color: var(--accent); color: #fff;
}

/* Model card */
.model-section { padding: 4px 12px 0; }
.model-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
}
.model-card.new { border-color: var(--new-badge); }
.model-card.new::before {
  content: "🆕"; position: absolute; margin-left: -8px; margin-top: -8px;
}
.model-head {
  padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.model-head:active { background: var(--card-hover); }
.model-head .rank {
  flex-shrink: 0;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--text-dim);
}
.model-head .info { flex: 1; min-width: 0; }
.model-head .name {
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}
.model-head .name .vendor {
  font-size: 11px; font-weight: 400; color: var(--text-dim);
  padding: 1px 6px; border-radius: 8px; background: var(--bg);
}
.model-head .name .tier-tag {
  font-size: 9px; padding: 1px 5px; border-radius: 6px;
  background: rgba(227,179,65,0.15); color: var(--gold); font-weight: 700;
}
.model-head .meta-line {
  font-size: 10px; color: var(--text-dim); margin-top: 2px;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.model-head .meta-line .region-cn { color: var(--cn-domestic); }
.model-head .meta-line .region-intl { color: var(--intl); }
.model-head .meta-line .oss { color: var(--green); }
.model-head .meta-line .close { color: var(--orange); }
.model-head .price-main {
  flex-shrink: 0; text-align: right;
}
.model-head .price-main .num {
  font-size: 16px; font-weight: 700; color: var(--text);
  font-family: 'SF Mono', Menlo, monospace;
}
.model-head .price-main .unit {
  font-size: 9px; color: var(--text-dim); margin-top: 2px;
}
.model-head .arrow {
  flex-shrink: 0;
  width: 18px; color: var(--text-muted);
  transition: transform 0.2s;
  font-size: 12px;
}
.model-card.expanded .arrow { transform: rotate(90deg); }

/* Expanded details */
.model-detail {
  display: none;
  padding: 8px 12px 12px;
  font-size: 11px;
  color: var(--text-dim);
  background: var(--bg);
}
.model-card.expanded .model-detail { display: block; }

/* Tier table */
.tier-table {
  margin: 6px 0;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 11px;
}
.tier-row {
  display: flex; align-items: center;
  padding: 4px 0;
  border-bottom: 1px dashed var(--border);
}
.tier-row:last-child { border-bottom: none; }
.tier-row .res {
  flex: 0 0 70px;
  color: var(--accent); font-weight: 600;
}
.tier-row .price {
  flex: 1;
  color: var(--text); font-weight: 600;
}
.tier-row .price small { color: var(--text-dim); font-weight: 400; }
.tier-row .note {
  flex: 1; font-size: 10px; color: var(--text-dim);
  font-family: -apple-system, sans-serif;
  text-align: right;
}

/* Platform chips */
.platforms {
  margin-top: 8px;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.platform-chip {
  font-size: 10px;
  padding: 3px 8px; border-radius: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-dim);

.platform-chip .name { color: var(--accent); font-weight: 600; }

/* Modalities */
.modalities {

  margin: 4px 0;

.mod {

/* Note */

  color: var(--text-dim);
  line-height: 1.5;
}

/* Section header */
.section-h {
  padding: 14px 16px 6px;
  font-size: 12px; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;

/* Platform list */

  border-radius: 10px;

.plat-card .pregion.intl { background: rgba(88,166,255,0.15); color: var(--intl); }
.plat-card .pnote { font-size: 10px; color: var(--text-dim); margin-top: 4px; }

/* Footer */
.footer {
  text-align: center; padding: 20px 16px;
  color: var(--text-muted); font-size: 10px;

.footer a { color: var(--accent); text-decoration: none; }

/* Tab content */
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Compare view */
.compare-table {
  margin: 0 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;

.compare-row {

  gap: 1px;
  background: var(--border);

.compare-row.head {
  background: var(--bg);
  position: sticky; top: 130px;

}
.compare-cell {

.compare-cell .name { color: var(--text); font-weight: 700; }
.compare-cell .price { color: var(--green); font-family: 'SF Mono', monospace; font-weight: 700; }
.compare-cell .note { font-size: 9px; color: var(--text-dim); margin-top: 2px; }

(function(){
  // Header
  const models = DATA.video_models;
  const meta = DATA.meta;
  document.getElementById('m-count').textContent = models.length;
  const cn = models.filter(m => m.region === '国内').length;
  const intl = models.length - cn;
  document.getElementById('m-cn').textContent = `国内 ${cn}`;
  document.getElementById('m-intl').textContent = `国际 ${intl}`;
  document.getElementById('m-updated').textContent = `更新于 ${meta.update_time}`;

  // Billing note
  const list = document.getElementById('billing-list');
  meta.billing_notes.forEach(n => {
    const li = document.createElement('li'); li.textContent = n; list.appendChild(li);
  });
  meta.watch_out.forEach(n => {
    const li = document.createElement('li'); li.className='warn'; li.textContent = n; list.appendChild(li);
  });

  // Change banner
  if (DATA.changes && DATA.changes.update_type) {
    const cb = document.getElementById('change-banner');
    cb.style.display = 'block';
    document.getElementById('cb-title').textContent = '🔔 ' + DATA.changes.update_type;
    document.getElementById('cb-detail').textContent = DATA.changes.summary;
  }

  // Compare table (main view)
  const cmp = document.getElementById('compare-table');
  const head = document.createElement('div');
  head.className = 'compare-row head';
  head.innerHTML = `
    <div class="compare-cell head">模型</div>
    <div class="compare-cell head">旗舰档价</div>
    <div class="compare-cell head">主流档价</div>
    <div class="compare-cell head">特点</div>
  `;
  cmp.appendChild(head);

  models.forEach((m, idx) => {
    const row = document.createElement('div');
    row.className = 'compare-row';
    // 旗舰档：选最高档价格
    const topTier = m.tiers[m.tiers.length-1];
    // 主流档：选中间档价格（720P或第二档）
    let mainTier = null;
    if (m.tiers.length >= 2) {
      mainTier = m.tiers[Math.floor(m.tiers.length/2)] || m.tiers[0];
    } else {
      mainTier = m.tiers[0];
    }
    const fmt = (t) => {
      if (!t) return '—';
      const p = t.price_cny || t.price_usd;
      if (!p && p !== 0) return '—';
      const cur = t.price_cny ? '¥' : '$';
      const num = t.price_cny || t.price_usd;
      return `${cur}${num}<small style="font-size:9px;color:var(--text-dim)"> /${t.unit.includes('second')?'秒':'次'}</small>`;
    };
    row.innerHTML = `
      <div class="compare-cell">
        <div class="name">${m.name}</div>
        <div style="font-size:9px;color:var(--text-dim);margin-top:2px">${m.vendor_cn} · ${m.region}</div>
      </div>
      <div class="compare-cell">
        <div class="price">${fmt(topTier)}</div>
        <div class="note">${topTier ? topTier.resolution || topTier.name || '' : ''}</div>
      </div>
      <div class="compare-cell">
        <div class="price">${fmt(mainTier)}</div>
        <div class="note">${mainTier ? mainTier.resolution || mainTier.name || '' : ''}</div>
      </div>
      <div class="compare-cell" style="font-size:10px;color:var(--text-dim);text-align:left;padding-left:10px">
        ${m.ranking || ''}
      </div>
    `;
    cmp.appendChild(row);
  });

  // Model detail list
  const list2 = document.getElementById('model-list');
  models.forEach((m, idx) => {
    const card = document.createElement('div');
    card.className = 'model-card' + (m._is_new ? ' new' : '');
    card.style.position = 'relative';

    // Head
    const head2 = document.createElement('div');
    head2.className = 'model-head';
    const tierBadge = m.tier ? `<span class="tier-tag">${m.tier}</span>` : '';
    const osTag = m.open_source.includes('开源') ? '<span class="oss">开源</span>' : '<span class="close">闭源</span>';
    const regionClass = m.region === '国内' ? 'region-cn' : 'region-intl';

    // 主显价格：选最高档
    const mainT = m.tiers[m.tiers.length-1];
    const mainNum = mainT.price_cny || mainT.price_usd;
    const mainCur = mainT.price_cny ? '¥' : '$';
    const mainUnit = mainT.unit.includes('second') ? '/秒' : '/次';

    head2.innerHTML = `
      <div class="rank">${idx+1}</div>
      <div class="info">
        <div class="name">
          ${m.name} ${tierBadge}
          <span class="vendor">${m.vendor_cn}</span>
        </div>
        <div class="meta-line">
          <span class="${regionClass}">${m.region}</span>
          ${osTag}
          <span>${m.modalities[0]}${m.modalities.length>1 ? ' · 多模态' : ''}</span>
          ${m.native_audio ? '<span style="color:var(--gold)">🔊原生音频</span>' : ''}
        </div>
      </div>
      <div class="price-main">
        <div class="num">${mainCur}${mainNum}</div>
        <div class="unit">${mainUnit} · ${mainT.resolution || mainT.name || ''}</div>
      </div>
      <div class="arrow">▶</div>
    `;
    card.appendChild(head2);

    // Detail (collapsed by default)
    const detail = document.createElement('div');
    detail.className = 'model-detail';

    // Modalities
    const mods = m.modalities.map(mt => {
      const cls = mt.includes('音频') ? 'mod audio' : 'mod';
      return `<span class="${cls}">${mt}</span>`;
    }).join('');
    detail.innerHTML += `<div class="modalities">${mods}</div>`;

    // Ranking
    if (m.ranking) {
      detail.innerHTML += `<div class="ranking">� ${m.ranking}</div>`;
    }

    // Note
    if (m.note) {
      detail.innerHTML += `<div class="model-note">${m.note}</div>`;
    }

    // Tier table
    let tierHtml = '<div class="tier-table">';
    m.tiers.forEach(t => {
      const cur = t.price_cny ? '¥' : '$';
      const num = t.price_cny || t.price_usd;
      const unitText = t.unit.includes('second') ? '/秒' : '/次';
      tierHtml += `
        <div class="tier-row">
          <div class="res">${t.resolution || t.name || '默认'}</div>
          <div class="price">${cur}${num}${unitText}</div>
          <div class="note">${t.note || t.duration_range || ''}</div>
        </div>
      `;
    });
    // Other versions
    if (m.other_versions) {
      m.other_versions.forEach(v => {
        const cur = typeof v.price_cny === 'string' ? '¥' : '$';
        const num = v.price_cny || v.price_usd;
        const unitText = v.unit.includes('second') ? '/秒' : '/次';
        tierHtml += `
          <div class="tier-row" style="opacity:0.7">
            <div class="res" style="color:var(--purple)">${v.name}</div>
            <div class="price" style="color:var(--purple)">${v.price_cny ? '¥' : '$'}${v.price_cny || v.price_usd}${unitText}</div>
            <div class="note">${v.note || v.resolution || ''}</div>
          </div>
        `;
      });
    }
    if (m.fast_tiers) {
      m.fast_tiers.forEach(v => {
        tierHtml += `
          <div class="tier-row" style="opacity:0.85">
            <div class="res" style="color:var(--teal)">${v.name}<br>${v.resolution}</div>
            <div class="price" style="color:var(--teal)">$${v.price_usd}/秒</div>
            <div class="note">极速档</div>
          </div>
        `;
      });
    }
    if (m.pro_tiers) {
      m.pro_tiers.forEach(v => {
        tierHtml += `
          <div class="tier-row" style="opacity:0.85">
            <div class="res" style="color:var(--gold)">${v.name}<br>${v.resolution}</div>
            <div class="price" style="color:var(--gold)">$${v.price_usd}/秒</div>
            <div class="note">${v.note || ''}</div>
          </div>
        `;
      });
    }
    tierHtml += '</div>';
    detail.innerHTML += tierHtml;

    // Platforms
    const platKeys = Object.keys(m.platforms || {});
    if (platKeys.length) {
      let pHtml = '<div style="margin-top:8px;font-size:10px;color:var(--text-dim)">原厂/中转入口：</div><div class="platforms">';
      platKeys.forEach(pk => {
        const p = m.platforms[pk];
        const dis = p.discount ? (p.discount === 1.0 ? '原价' : `×${p.discount}`) : '';
        pHtml += `<span class="platform-chip"><span class="name">${pk}</span>${dis ? '<span class="dis">' + dis + '</span>' : ''}<span style="color:var(--text-muted);margin-left:4px">${p.note || ''}</span></span>`;
      });
      pHtml += '</div>';
      detail.innerHTML += pHtml;
    }

    card.appendChild(detail);

    // Click to expand
    head2.addEventListener('click', () => {
      card.classList.toggle('expanded');
    });

    list2.appendChild(card);
  });

  // Platform list
  const plist = document.getElementById('platform-list');
  DATA.platforms.forEach(p => {
    const c = document.createElement('div');
    c.className = 'plat-card';
    c.innerHTML = `
      <div>
        <span class="pname">${p.name}</span>
        <span class="pregion ${p.region==='国内'?'domestic':'intl'}">${p.region}</span>
      </div>
      <div style="margin-top:4px;font-size:10px"><a href="${p.url}" style="color:var(--accent);text-decoration:none" target="_blank">${p.url}</a></div>
      <div class="pnote">${p.note}</div>
    `;
    plist.appendChild(c);
  });

  // Tab switching
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('tab-' + t.dataset.tab).classList.add('active');
    });
  });
})();
</script>
</body>
</html>
