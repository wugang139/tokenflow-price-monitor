<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" "black-translucent">
<title>TokenFlow 热门模型价格监控</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --card-hover: #1c2330;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #7d8590;
  --text-muted: #484f58;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --orange: #db6d28;
  --purple: #bc8cff;
  --pink: #f778ba;
  --teal: #39d0d8;
  --gold: #e3b341;
  --changed: #f85149;
  --changed-bg: rgba(248,81,73,0.08);
  --changed-border: rgba(248,81,73,0.35);
  --new-badge: #f85149;
  /* Category colors */
  --cat-coding: #58a6ff;
  --cat-coding-bg: rgba(88,166,255,0.15);
  --cat-video: #f778ba;
  --cat-video-bg: rgba(247,120,186,0.18);
  --cat-reasoning: #bc8cff;
  --cat-reasoning-bg: rgba(188,140,255,0.15);
  --cat-multimodal: #39d0d8;
  --cat-multimodal-bg: rgba(57,208,216,0.15);
  --cat-audio: #fb923c;
  --cat-audio-bg: rgba(251,146,60,0.15);
  --cat-image: #a78bfa;
  --cat-image-bg: rgba(167,139,250,0.15);
  --cat-vidu: #fbbf24;
  --cat-vidu-bg: rgba(251,191,36,0.15);
  --cat-platform: #bc8cff;
  --cat-platform-bg: rgba(188,140,255,0.15);
  --cat-open: #3fb950;
  --cat-open-bg: rgba(63,185,80,0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 90px;
}
/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,17,23,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 8px;
}
.header h1 {
  font-size: 18px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}
.header h1 .emoji { font-size: 20px; }
.header .meta {
  font-size: 11px; color: var(--text-dim);
  margin-top: 4px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.header .meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Change banner */
.change-banner {
  margin: 6px 12px;
  padding: 8px 12px;
  background: var(--changed-bg);
  border: 1px solid var(--changed-border);
  border-radius: 10px;
  display: flex; align-items: flex-start; gap: 8px;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.change-banner .cb-icon { font-size: 16px; flex-shrink: 0; }
.change-banner .cb-content { flex: 1; min-width: 0; }
.change-banner .cb-title { font-size: 13px; font-weight: 700; color: var(--changed); }
.change-banner .cb-detail { font-size: 11px; color: var(--text-dim); margin-top: 2px; line-height: 1.6; }
.change-banner .cb-detail .hl { color: var(--changed); font-weight: 600; }
.change-banner .cb-close {
  font-size: 14px; color: var(--text-muted); cursor: pointer;
  flex-shrink: 0; padding: 0 4px;
}

/* Filter tabs */
.tabs {
  display: flex; gap: 6px; padding: 8px 16px 4px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 5px 12px; border-radius: 16px;
  font-size: 12px; font-weight: 600;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer; transition: all 0.2s;
}
.tab.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.tab .tab-count { font-size: 10px; opacity: 0.7; margin-left: 2px; }
.tab.tab-coding.active { background: var(--cat-coding); border-color: var(--cat-coding); }
.tab.tab-video.active { background: var(--cat-video); border-color: var(--cat-video); }
.tab.tab-image.active { background: var(--cat-image); border-color: var(--cat-image); }
.tab.tab-audio.active { background: var(--cat-audio); border-color: var(--cat-audio); }
.tab.tab-vidu.active { background: var(--cat-vidu); border-color: var(--cat-vidu); }
.tab.tab-platform.active { background: var(--cat-platform); border-color: var(--cat-platform); }

/* ========== 平台/系统面板 ========== */
.platform-panel {
  padding: 12px 4px 32px 4px;
  max-width: 1200px;
  margin: 0 auto;
}
.platform-header {
  background: linear-gradient(135deg, #1a1f2e 0%, #2a3142 100%);
  border: 1px solid var(--border);
  border-left: 4px solid var(--cat-platform);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 16px;
}
.platform-header h2 {
  font-size: 16px; color: var(--text); margin: 0 0 4px 0; font-weight: 700;
}
.platform-header p {
  font-size: 12px; color: var(--text-muted); margin: 0; line-height: 1.5;
}
.platform-rules {
  margin-top: 12px; padding-left: 18px;
  font-size: 11px; color: var(--text-dim); line-height: 1.8;
}
.platform-vendor-group { margin-bottom: 20px; }
.platform-vendor-title {
  font-size: 13px; font-weight: 700; color: var(--text);
  margin: 0 0 10px 0; display: flex; align-items: center; gap: 8px;
}
.platform-vendor-title .vcount {
  font-size: 10px; font-weight: 600; padding: 2px 8px;
  background: var(--cat-platform-bg); color: var(--cat-platform);
  border: 1px solid rgba(188,140,255,0.3); border-radius: 10px;
}
.platform-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.platform-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-left: 4px solid var(--cat-platform); border-radius: 8px;
  padding: 14px 16px;
}
.platform-card:hover { border-color: var(--cat-platform); }
.platform-card-head {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
}
.platform-tag {
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  background: var(--cat-platform-bg); color: var(--cat-platform);
  border: 1px solid rgba(188,140,255,0.35); border-radius: 10px;
}
.platform-name { font-size: 14px; font-weight: 700; color: var(--text); }
.platform-tier {
  font-size: 10px; padding: 2px 7px; border-radius: 10px;
  background: rgba(255,255,255,0.06); color: var(--text-dim);
  border: 1px solid var(--border);
}
.platform-price {
  font-size: 22px; font-weight: 800; color: var(--gold); margin: 6px 0 2px 0;
}
.platform-price .unit { font-size: 11px; font-weight: 600; color: var(--text-dim); margin-left: 4px; }
.platform-features { margin: 10px 0 0 0; padding-left: 16px; }
.platform-features li { font-size: 11px; color: var(--text-dim); line-height: 1.8; }
.platform-note {
  margin-top: 10px; padding: 8px 10px; font-size: 11px; line-height: 1.6;
  background: rgba(188,140,255,0.06); border-radius: 6px; color: var(--text-dim);
  border-left: 2px solid rgba(188,140,255,0.4);
}
.platform-sep-note {
  margin-top: 14px; padding: 10px 12px; font-size: 11px; line-height: 1.7;
  background: rgba(227,179,65,0.08); border: 1px dashed rgba(227,179,65,0.3);
  border-radius: 8px; color: var(--text-dim);
}

/* Category explainer banner */
.category-explainer {
  margin: 6px 12px;
  padding: 10px 12px;
  background: rgba(88,166,255,0.06);
  border: 1px dashed rgba(88,166,255,0.25);
  border-radius: 10px;
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.6;
}
.category-explainer .ce-title {
  font-size: 12px; font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.category-explainer .ce-tags {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 6px;
}
.category-explainer .ce-sort {
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid rgba(88,166,255,0.1);
  font-size: 10px;
  color: var(--text-muted);
}
.category-explainer .ce-sort b { color: var(--text-dim); font-weight: 600; }

/* Section title */
.section-title {
  font-size: 13px; font-weight: 700; color: var(--text-dim);
  padding: 12px 16px 6px;
  text-transform: uppercase; letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 6px;
}
.section-title .new-count {
  font-size: 11px; padding: 1px 6px; border-radius: 8px;
  background: var(--changed-bg); color: var(--changed); font-weight: 700;
}

/* Model card */
.model-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin: 6px 12px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.model-card:active { border-color: var(--accent); }
.model-card.expanded { border-color: var(--accent); }

/* New model card - special border */
.model-card.is-new {
  border-color: var(--changed-border);
  border-width: 1px;
  position: relative;
}
.model-card.is-new::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--changed), var(--orange));
  border-radius: 12px 12px 0 0;
}

/* Video card variant */
.model-card.is-video {
  border-color: rgba(247,120,186,0.25);
}
.model-card.is-video.is-new::before {
  background: linear-gradient(90deg, var(--cat-video), var(--purple));
}

.mc-header {
  padding: 10px 14px;
  cursor: pointer;
}
.mc-top-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.mc-left { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.mc-left-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mc-left-bottom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px;}
.vendor-badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 4px;
  white-space: nowrap;
}
.model-family {
  font-size: 14px; font-weight: 600;
  white-space: nowrap;
}
.model-version {
  font-size: 12px; font-weight: 500; color: var(--text-dim);
  white-space: nowrap;
}
.model-tier {
  font-size: 10px; color: var(--text-dim);
  white-space: nowrap;
}
/* Persistent category reason subtitle (card header, coding/video models) */
/* 2026-08-17 修复：允许自动换行，手机窄屏也能完整显示（长度由 JS 80 字截断控制） */
.mc-cat-reason {
  margin-top: 5px;
  padding: 3px 8px;
  border-left: 3px solid var(--cat-coding);
  border-radius: 4px;
  background: rgba(88,166,255,0.06);
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.5;
  white-space: normal;
  word-break: break-word;
  cursor: help;
}
.mc-cat-reason.is-video-reason {
  border-left-color: var(--cat-video);
  background: rgba(247,120,186,0.06);
}
.mc-cat-reason .mcr-label {
  font-size: 9px; font-weight: 800;
  color: var(--cat-coding);
  margin-right: 5px;
}
.mc-cat-reason.is-video-reason .mcr-label { color: var(--cat-video); }

.new-badge {
  font-size: 9px; font-weight: 800;
  padding: 1px 5px; border-radius: 3px;
  background: var(--new-badge); color: #fff;
  margin-left: 4px;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.6} }

/* Category badges */
.cat-badge {
  font-size: 9px; font-weight: 700;
  padding: 1px 6px; border-radius: 8px;
  cursor: help;
  display: inline-flex; align-items: center; gap: 2px;
  white-space: nowrap;
}
.cat-badge.cat-coding { background: var(--cat-coding-bg); color: var(--cat-coding); border: 1px solid rgba(88,166,255,0.3); }
.cat-badge.cat-video { background: var(--cat-video-bg); color: var(--cat-video); border: 1px solid rgba(247,120,186,0.3); }
.cat-badge.cat-reasoning { background: var(--cat-reasoning-bg); color: var(--cat-reasoning); border: 1px solid rgba(188,140,255,0.3); }
.cat-badge.cat-multimodal { background: var(--cat-multimodal-bg); color: var(--cat-multimodal); border: 1px solid rgba(57,208,216,0.3); }
.cat-badge.cat-audio { background: var(--cat-audio-bg); color: var(--cat-audio); border: 1px solid rgba(251,146,60,0.3); }
.cat-badge.cat-image { background: var(--cat-image-bg); color: var(--cat-image); border: 1px solid rgba(167,139,250,0.3); }
.cat-badge.cat-vidu { background: var(--cat-vidu-bg); color: var(--cat-vidu); border: 1px solid rgba(251,191,36,0.3); }
.cat-badge.cat-open { background: var(--cat-open-bg); color: var(--cat-open); border: 1px solid rgba(63,185,80,0.3); }

.mc-right {
  display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
}
.price-main {
  font-size: 15px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.price-unit { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

/* Changed price highlight */
.price-main.changed {
  color: var(--changed);
}
/* Price warning (missing/zero/mismatch) */
.price-main.price-warn {
  color: #ff4444;
}
.alert-badge {
  font-size: 9px; font-weight: 800;
  padding: 1px 5px; border-radius: 3px;
  background: #ff4444; color: #fff;
  margin-left: 4px;
  white-space: nowrap;
}
.alert-badge.all-na { background: #ff6600; }
.alert-badge.price-missing { background: #cc0000; }
.alert-badge.price-mismatch { background: #ff4444; }
.model-card.has-alert {
  border-left: 3px solid #ff4444;
}
.price-main.changed::after {
  content: ' \25B2'; font-size: 10px; color: var(--changed);
}

/* Best channel row */
.mc-best-row {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px;
  padding: 6px 8px;
  background: rgba(63,185,80,0.08);
  border: 1px solid rgba(63,185,80,0.2);
  border-radius: 8px;
}
.mc-best-row .best-icon { font-size: 14px; }
.mc-best-row .best-label {
  font-size: 11px; color: var(--text-dim); font-weight: 500;
}
.mc-best-row .best-channel {
  font-size: 13px; font-weight: 700; color: var(--green);
}
.mc-best-row .best-discount {
  font-size: 14px; font-weight: 800; color: var(--green);
  font-variant-numeric: tabular-nums;
  margin-left: auto;
}
.mc-best-row .best-price {
  font-size: 11px; color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.mc-best-row .expand-hint {
  font-size: 11px; color: var(--text-muted);
  margin-left: 4px;
}
.mc-body {
  display: none;
  padding: 0 14px 12px;
  border-top: 1px solid var(--border);
}
.model-card.expanded .mc-body { display: block; }

/* Category reason block (inside expanded card) */
.cat-reason {
  margin: 8px 0 6px;
  padding: 6px 10px;
  background: rgba(88,166,255,0.05);
  border-left: 2px solid var(--accent);
  border-radius: 4px;
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.55;
}
.cat-reason .cr-label {
  font-size: 10px; font-weight: 700;
  color: var(--accent);
  margin-right: 4px;
}

/* Video tier table */
.video-tier-table {
  width: 100%; margin-top: 6px;
  border-collapse: collapse;
  font-size: 11px;
}
.video-tier-table th {
  text-align: left; font-weight: 600;
  color: var(--text-dim); padding: 4px;
  border-bottom: 1px solid var(--border);
  font-size: 10px;
}
.video-tier-table td {
  padding: 4px;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  font-variant-numeric: tabular-nums;
}
.video-tier-table tr:last-child td { border-bottom: none; }

/* Video platform discount table (connected platforms only) */
.vp-divider {
  display: flex; align-items: center; gap: 8px;
  margin: 12px 0 4px;
  font-size: 10px; color: var(--text-muted); font-weight: 700;
  white-space: nowrap;
}
.vp-divider::before, .vp-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.video-plat-table {
  width: 100%; margin-top: 4px;
  border-collapse: collapse;
  font-size: 11px;
}
.video-plat-table th {
  text-align: left; font-weight: 600;
  color: var(--text-dim); padding: 4px;
  border-bottom: 1px solid var(--border);
  font-size: 10px;
}
.video-plat-table td {
  padding: 4px;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  font-variant-numeric: tabular-nums;
}
.video-plat-table tr:last-child td { border-bottom: none; }
.video-plat-table .vp-best { color: var(--green); font-weight: 800; }
.video-plat-table tr.vp-best-row td { background: rgba(63,185,80,0.06); }
.vp-oem-tag {
  font-size: 8px; font-weight: 700;
  padding: 1px 4px; border-radius: 3px;
  background: rgba(63,185,80,0.15); color: var(--green);
  margin-left: 3px;
}
.vp-best-tag {
  font-size: 8px; font-weight: 700;
  margin-left: 3px;
}

/* Price detail table */
.price-table {
  width: 100%; margin-top: 8px;
  border-collapse: collapse;
  font-size: 12px;
}
.price-table th {
  text-align: left; font-weight: 600;
  color: var(--text-dim); padding: 6px 4px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}
.price-table td {
  padding: 6px 4px;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  font-variant-numeric: tabular-nums;
}
.price-table tr:last-child td { border-bottom: none; }
.price-table .platform-name { color: var(--text); font-weight: 500; }
.price-table tr.best-row {
  background: rgba(63,185,80,0.08);
}
.price-table tr.best-row .platform-name {
  color: var(--green); font-weight: 700;
}
.price-table tr.best-row td:first-child::before {
  content: '\2605 '; color: var(--gold);
}

/* Changed platform row highlight */
.price-table tr.changed-row {
  background: var(--changed-bg);
}
.price-table tr.changed-row td {
  color: var(--changed);
}
.price-table tr.changed-row .platform-name {
  color: var(--changed); font-weight: 600;
}
.price-table td.changed-cell {
  color: var(--changed); font-weight: 700;
}

.price-table .discount-tag {
  display: inline-block;
  font-size: 10px; font-weight: 700;
  padding: 1px 5px; border-radius: 3px;
}
.tag-green { background: rgba(63,185,80,0.15); color: var(--green); }
.tag-yellow { background: rgba(210,153,34,0.15); color: var(--yellow); }
.tag-red { background: rgba(248,81,73,0.15); color: var(--red); }
.tag-gray { background: rgba(125,133,144,0.15); color: var(--text-dim); }
.tag-blue { background: rgba(88,166,255,0.15); color: var(--accent); }

/* 备注 Tab 角标 */
.tab-notes { position: relative; }
.notes-badge {
  display: inline-block;
  margin-left: 4px;
  font-size: 10px;
  font-weight: 800;
  background: #9b6dff;
  color: #fff;
  padding: 1px 6px;
  border-radius: 8px;
  line-height: 1.4;
  min-width: 18px;
  text-align: center;
  vertical-align: 1px;
}

/* Note */
.model-note {
  font-size: 11px; color: var(--yellow);
  margin-top: 6px; padding: 4px 8px;
  background: rgba(210,153,34,0.08);
  border-radius: 4px;
}

/* Summary bar */
.summary-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13,17,23,0.92);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  padding: 8px 16px;
  display: flex; justify-content: space-around;
  z-index: 100;
}
.summary-item {
  text-align: center;
}
.summary-item .label { font-size: 10px; color: var(--text-dim); }
.summary-item .value { font-size: 14px; font-weight: 700; }

/* Region colors */
.r-international { background: rgba(88,166,255,0.15); color: var(--accent); }
.r-domestic { background: rgba(63,185,80,0.15); color: var(--green); }

/* Vendor colors - existing */
.v-Anthropic { background: rgba(210,153,34,0.2); color: var(--yellow); }
.v-OpenAI { background: rgba(63,185,80,0.15); color: var(--green); }

/* Expand arrow */
.expand-arrow {
  width: 20px; text-align: center;
  color: var(--text-muted); font-size: 12px;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.model-card.expanded .expand-arrow { transform: rotate(180deg); }

/* Watch list section */
.watch-divider {
  margin: 16px 12px 8px;
  border: none;
  border-top: 2px dashed var(--border);
  position: relative;
}
.watch-divider::after {
  content: '待观察新模型 · 观察期7天';
  position: absolute;
  top: -11px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--text-dim);
  background: var(--bg);
  padding: 0 12px;
  white-space: nowrap;
}
.model-card.watch-list {
  border-style: dashed;
  border-color: var(--accent);
  opacity: 0.92;
}
.model-card.watch-list.is-new {
  border-color: var(--changed-border);
  border-style: dashed;
}
.watch-badge {
  font-size: 9px; font-weight: 700;
  padding: 2px 6px; border-radius: 3px;
  background: rgba(88,166,255,0.2); color: var(--accent);
  margin-left: 4px;
  animation: none;
}
.watch-days {
  font-size: 10px; color: var(--text-dim);
  margin-top: 4px;
  padding: 4px 8px;
  background: rgba(88,166,255,0.06);
  border-radius: 6px;
  display: inline-flex; align-items: center; gap: 4px;
}
.watch-days .countdown { color: var(--accent); font-weight: 700; }
.watch-days .auto-promote { color: var(--green); font-size: 9px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 13px;
}
.empty-state .emoji { font-size: 32px; opacity: 0.4; margin-bottom: 12px; }

/* ========== 备注面板 ========== */
.notes-panel {
  padding: 12px 4px 32px 4px;
  max-width: 1200px;
  margin: 0 auto;
}
.notes-header {
  background: linear-gradient(135deg, #1a1f2e 0%, #2a3142 100%);
  border: 1px solid var(--border);
  border-left: 4px solid #9b6dff;
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 16px;
}
.notes-header h2 {
  font-size: 16px;
  color: var(--text);
  margin: 0 0 4px 0;
  font-weight: 700;
}
.notes-header p {
  font-size: 12px;
  color: var(--text-muted);
  margin: 0;
  line-height: 1.5;
}
.notes-summary {
  display: flex;
  gap: 12px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.notes-summary-chip {
  font-size: 11px;
  padding: 3px 10px;
  background: rgba(155, 109, 255, 0.12);
  color: #b89aff;
  border: 1px solid rgba(155, 109, 255, 0.3);
  border-radius: 12px;
  font-weight: 600;
}
.note-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-left: 4px solid #9b6dff;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.note-card:hover {
  transform: translateX(2px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
}
.note-card.cat-warning { border-left-color: #ff9b3d; }
.note-card.cat-warning .note-tag { background: rgba(255, 155, 61, 0.15); color: #ff9b3d; border-color: rgba(255, 155, 61, 0.4); }
.note-card.cat-other   { border-left-color: #6cc8ff; }
.note-card.cat-other   .note-tag { background: rgba(108, 200, 255, 0.15); color: #6cc8ff; border-color: rgba(108, 200, 255, 0.4); }

.note-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.note-tag {
  font-size: 10px;
  padding: 2px 8px;
  background: rgba(155, 109, 255, 0.15);
  color: #b89aff;
  border: 1px solid rgba(155, 109, 255, 0.4);
  border-radius: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.note-id {
  font-size: 10px;
  color: var(--text-muted);
  font-family: 'SF Mono', Menlo, Consolas, monospace;
}
.note-date {
  font-size: 10px;
  color: var(--text-muted);
  margin-left: auto;
}
.note-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin: 0 0 6px 0;
  line-height: 1.4;
}
.note-content {
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}
.note-scope {
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-muted);
}
.note-scope .scope-label {
  color: #6cc8ff;
  font-weight: 600;
  margin-right: 4px;
}
.note-related-link {
  display: inline-block;
  margin-left: 8px;
  font-size: 11px;
  color: #ff9b3d;
  text-decoration: none;
  border: 1px solid rgba(255,155,61,0.3);
  padding: 1px 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
}
.note-related-link:hover {
  background: rgba(255,155,61,0.15);
}

  font-weight: 600;
  text-decoration: none;
  border: 1px solid rgba(255,155,61,0.3);

.mc-warning .warn-ref:hover { background: rgba(255,155,61,0.25); }

  font-weight: 800;
  padding: 2px 6px;

t": "图片模型普遍按\"每张\"计费（per-generation 或 per-image），也有按积分计费的（如部分平台采用 1张= N积分 的套餐）。折扣率比较需换算为统一单位（如 元/张）。多张连环生图（如 4 联图）需叠加 4 倍费用，注意辨别。", "scope": "image 模型（本目录暂未单独收录）", "created_date": "2026-08-17"}, {"id": "n005", "category": "观察窗口", "title": "渠道商公开价 vs 实际成交价", "content": "本目录记录的渠道商价格均来自其官网 Model Marketplace 或公开询价表（无需账号注册即可查到的价格），属于\"list price\"。实际成交价可能因充值量、长期合约、子账号权限等有额外折扣。报价给客户前，建议加上最低对外折扣（=最低供应商折扣 + 0.03）作为对外报价，而非直接套用 list price。", "scope": "所有渠道商", "created_date": "2026-08-17"}, {"id": "n006", "category": "渠道商报价", "title": "汇率取值规则：官方央行中间价（2026-08-19起生效）+ TMax官网价/折扣率双层结构", "content": "TMax 2026-08-18报价表新增「官网单价」和「折扣率」两个维度。官网价=TMax平台挂牌价（接近或等于模型原厂价），折扣率=采购实际折扣（5折~8折不等）。实际成交价=官网价×折扣率。汇率基准0.1481（1USD≈6.75CNY），与监控7.2汇率有约6.6%差异。部分模型（KIMI K3/Minimax M3/Hy3.0）折扣率标注TBD。 【决策更新 2026-08-19】刚哥确认：监控体系汇率取值改为国家官方数据——中国人民银行授权中国外汇交易中心公布的当日人民币兑美元中间价（2026-08-18为6.7905），自2026-08-19更新日起生效，不再固定用7.2。每次价格更新时先查官方中间价再折算，并更新fx_rate字段。TMax报价自带汇率0.1481仅作为其报价口径参考。", "scope": "TMax渠道全部模型", "created_date": "2026-08-18"}, {"id": "n007", "category": "品类观察", "title": "AI编程IDE品类观察项（TMax 260818报价触发）", "content": "TMax 260818报价表含7款AI编程IDE产品（Qoder/QoderWork CN、Trae企业旗舰、CodeBuddy企业旗舰、Mulerun Enterprise、ArkClaw企业标准、Kimi Claw会员企业版、WorkBuddy企业旗舰），按席位/月或席位/年订阅计费，与Token监控体系计费模式不兼容，暂不纳入。决策(刚哥2026-08-19)：纳入观察项，每周日更新时观察业界趋势和需要，若有相应热点，提出以增加一个栏目方式纳入监控的方案再行决定。参考价：Trae企业旗舰版¥149.00/席位/月(7折)，其余多款TBD。 更新观察(2026-08-30)：\n- **价格分层已标准化**：海外主流 baseline $10-25/席位/月 (GitHub Copilot/Cursor/Windsurf/Claude Code)，senior/premium tier $32-96/席位/月\n- **WorkBuddy 国际版**：$10/月，多模型(Claude/GPT-5/Gemini)三形态出题；TMax 报中\"WorkBuddy 企业旗舰\"；已在 8月底公开售卖，与 TokenFlow 自有平台不同，定位企业端 IDE 助手\n- **Cursor 6月从 credit → 用量乘数 + 每日配额**：行业开始转向\"基线订阅 + usage quota\"\n- **Cursor Pro+ $60/月、Ultra $200/月**；Windsurf Pro $15/月, Max $40/月, Max200 $200/月；Claude Code $17/月个人 + base fee + API token\n- **国内**：Trae 个人版 0元（企业另计）/企业基础版 ¥49、团队版 ¥99；CodeBuddy 企业旗舰 ¥78/专享 ¥158；百度 Comate 个人专业 ¥100/月/企业 ¥119+/人/月；阿里通义灵码 企业标准 ¥79/席位/月\n- **计费模式趋势**：仍是 Seat/Month 占绝对主流；Cursor 6/1的 credit 重构是把 \"monthly quota\" 嵌入订阅，但底层仍是订阅模式。**未见向纯 Token 计费的转向**\n- **决策更新(2026-08-30)**：本周保持观察项状态，**不新增 Tab**，等出现重大转变（如主流产品大规模 Token 化、或 Token 厂商大举进入 IDE）时再行评估 更新观察(2026-09-06)：\n- **Google Antigravity 2.0 取代 Gemini CLI（2026-06-18 正式迁移）**：Google I/O 2026 上发布，agent-first IDE 多智能体编排+语音命令+浏览器验证；CLI 命令已改为 `agy`；订阅 tier：Free（个人 Gmail 周配额）→ AI Pro $20/mo → AI Ultra $100 → AI Ultra Top $200\n- **Cursor v3（2026-04 发布）**：支持 8 agent 并行+多仓库执行，最高 $200/月 Ultra\n- **Claude Code**：Claude Pro $20/mo 已包含；Max 5x $100/月 或 Max 20x $200/月为重度用户\n- **Codex CLI**（OpenAI Apache-2.0 Rust）：ChatGPT Plus $20/mo 已含，Pro $200/mo；可与 Antigravity 一样多模型路由\n- **Z.ai GLM Coding Plan（Token厂商进入 IDE）**：$18-160/月（Lite/Pro/Max），与 Claude Code/Cline/OpenCode/Cursor 兼容；GLM-5.2 缓存命中 ~$0.26/MTok；**峰值时段（UTC+8 14-18）3x quota，9 月 promotion off-peak 1x** — 这是首次有 Token 厂商以订阅+quota 模式切入 IDE，与监控体系最接近的对标产品\n- **核心信号 (2026-09)**：(1) $20/月已成为 baseline（Claude Pro / Cursor Pro / Windsurf Pro / Antigravity Pro / Codex Plus / ChatGPT Plus）— 海外编程 IDE 普遍抬高订阅价；(2) Token 厂商 (Z.ai) 开始反向进入 IDE 赛道，定价$18 起；(3) 套餐+quota 是主流，纯 Token 计费未普及\n- **决策更新(2026-09-06)**：本周继续保持观察项状态，**不新增 Tab**；Z.ai GLM Coding Plan 作为新观察点（如 TokenFlow 客户有此需求，可直接引荐），但不纳入监控。等待更明确的\"Token 厂商大举 IDE 化\"或\"主流 IDE 全面 Token 计费化\"信号再行评估建 Tab 必要性\n【2026-09-27 观察】Cursor Pro $20/月（2026-03 提价后基线）、Teams $40、Ultra $200；Windsurf Pro $20、Teams $40、Enterprise ~$60（FedRAMP/SOC2 合规档）、Max $200；GitHub Copilot $10/$19；TRAE 基础版免费+企业定制（私有化主打）；CodeBuddy 免费/Pro $12/企业定制；通义灵码免费+企业版~¥30/人。结论：①$20 个人订阅基线稳固 ②企业版 $40-60/席为主流 ③国内厂商走免费+私有化定制路线 ④无厂商转向 API/Token 计费。不建议增设 IDE 栏目，继续月度观察。 【2026-10-11 第 3 次观察更新】①**Windsurf 已更名为 Devin Desktop**（Cognition 于 2026-06-02 完成更名，档位承接）：Free（轻度额度）/Pro $20/Max $200/Teams $80 起 + $40 每全席 —— 此前 9/27 记录的 Windsurf Teams $40、Enterprise ~$60 已作废，外部引用须改用 Devin Desktop 口径。②**GitHub Copilot 自 2026-06-01 转为 AI Credits 计量**：1 credit = $0.01，Business $19/席含 1,900 credits、Enterprise $39/席含 3,900 credits，代码补全不计量、Agent/chat/code review 走 credits；个人档 Pro $10 / Pro+ $39 / Max $100。③**Anthropic 10/7 起向 Max/Team 订阅发放月度 API 额度**（Max 5x $100/月、Max 20x $200/月、Team 最高 $500 池化），可用于任意模型——订阅与 API 首次打通，但本质仍是额度制订阅而非纯 Token 计费。④OpenAI Codex 自 2026-04 起按 token credits 计费；DevDay（9/29）新增 ChatGPT Pro 500（$500/月，25× Plus 额度 + Ultrafast 300 tok/s），同时**下调既有 $200 Pro 档**（Codex/Work 从 20× 降至 10×、GPT-6 Pro 消息 200→100）。⑤$20/月个人档仍是行业基线（Claude Code via Claude Pro、Cursor Pro、Devin Desktop Pro、Kiro Pro、Warp Build、Replit Core 均为 $20），$10 档仅有 Copilot Pro 与 JetBrains AI Pro；**高端档整体上探至 $200-$500**（Cursor Ultra $200、Devin Max $200、Claude Max $200、ChatGPT Pro 500 $500）。⑥Google Antigravity 以 Google AI 计划额度承载（AI Pro $19.99 / Ultra $99.99 与 $199.99）。**结论（维持 9/27 判断）**：仍无任何主流 IDE/编码 Agent 转向对外的纯 API·Token 零售计费，订阅+额度（含 credits 计量）是唯一主流形态，因此**继续不建议在监控页增设 IDE 栏目**；但 n007 需按上述更名与 credits 化事实更新，避免对外材料引用过期档位。 【2026-10-17 第 4 次观察更新】本周检索（Cursor/Windsurf(Trae)/Devin Desktop/Copilot/通义灵码/CodeBuddy 等）确认：①**价格与计费模式无重大变化**——$20/月个人档仍是行业基线（Cursor Pro、Devin Desktop Pro、Kiro Pro、Warp Build、Replit Core 等），企业版主流为 $40-60/席/月，高端档 $200-500；②**仍无任何主流 IDE/编码 Agent 转向对外纯 API·Token 零售计费**，订阅+额度（含 credits 计量）是唯一主流形态（Copilot credits、Anthropic Max 额度发放均属额度制而非纯 Token 零售）；③国内厂商继续走免费+私有化定制路线。\n**结论（维持 10-11 判断）**：继续不建议在监控页增设 IDE 栏目；本周无新增热点，不向刚哥提出增栏方案，保持月度观察即可。", "scope": "AI编程工具赛道整体", "created_date": "2026-08-19", "related_model_id": null, "last_updated": "2026-10-17", "updated_count": 3, "date": "2026-10-17"}, {"id": "n008", "category": "数据取值原则", "title": "价格数据取值原则：官网优先（出厂价取原厂官网，渠道价取渠道官网，冲突以官网为准）", "content": "①出厂价（OEM价）：一律取自模型厂家官方网站公布的定价（国内模型以原厂CNY定价为准，海外模型以原厂USD定价为准），非官方转载仅作交叉验证参考。②各平台渠道在相应模型上的标价：首选取值来自渠道官方网站公布的定价页；若渠道官网无该模型标价，则以手动提交的数据补充（需注明来源和提交日期）；若手动提交数据与渠道官网不一致，以官网为准，手动数据仅作参考留痕。③折扣栏（discount）：= 渠道标价 ÷ 出厂价（官网价），以折扣率/百分比呈现（如0.68=68%或68折），用于衡量该渠道相对原厂的价格水平。④每次价格更新均按以上原则取值；汇率按 n006 规则用央行中间价折算。本原则由刚哥2026-08-19确认，作为长期数据取值规范。", "scope": "全部模型×全部平台渠道的价格数据", "created_date": "2026-08-19", "related_model_id": null}, {"id": "n009", "category": "观察窗口/晋升", "title": "GLM-5.3 官方按量 API 定价确认并纳入正式清单", "content": "2026-08-20 智谱 BigModel 官方定价页已列出 GLM-5.3，输入/输出/缓存命中价格分别为 8元/28元/2元（$1.40/$4.40/$0.26），与 GLM-5.2 完全一致。多源交叉验证一致：官方定价页、OpenRouter、AiBoss、BlockBeats、LMSYS/TokenRate 等。2026-08-23 周更时从 watch_list 晋升至 hot_models 正式清单，分类为 text + coding。", "scope": "glm-5.3", "related_model_id": "glm-5.3", "created_date": "2026-08-23"}, {"id": "n010", "category": "观察窗口", "title": "Grok 4.6 / Gemini 3.7 Flash 纳入 watch_list 观察", "content": "xAI Grok 4.6（8/12发布）官方价 $2.00/$6.00，缓存命中 $0.50/1M tokens；输入≥200K时全请求按 $4/$12 计费。Google Gemini 3.7 Flash（8/13发布）官方促销价 $0.75/$3.75（缓存 $0.075）至2026-12-31，2027-01-01起恢复 $1.50/$7.50。两者均按 Token 计费且已有至少2个独立来源确认，纳入 watch_list_models 观察一周，下周评估是否替换现有 Grok 4.5 / Gemini 3.5 Flash。", "scope": "grok-4.6, gemini-3.7-flash", "created_date": "2026-08-23"}, {"id": "n011", "category": "价格异动", "title": "DeepSeek V4 峰谷计费基础价切换", "content": "DeepSeek官方定价页自2026-08-16 16:00 UTC起完全切换为峰谷计费，无单独'基础价'。TokenFlow监控将off-peak价格作为展示基础价，peak价格作为补充字段。客户报价时需明确峰谷时段：Peak UTC 01-04/06-10（北京时间 09-12/14-18），其余为Off-peak；周末（北京时间）全天Off-peak。", "scope": "deepseek-v4-pro, deepseek-v4-flash", "created_date": "2026-08-23", "related_model_id": ["deepseek-v4-pro", "deepseek-v4-flash"]}, {"id": "n012", "category": "周更规范", "title": "周更归纳须同时覆盖「主观版本更新/变动」与「客观市场动态」", "content": "每周周更完成时，在归纳性文字（即「关键建议/向刚哥汇报」之前的总结段）中，应同时涵盖两类内容：①上一周用户（刚哥）主动做出的版本更新或变动要点（如新增/移除模型、调整分类、汇率规则变更、数据取值原则修订、Tab/栏目调整等），需进行跟踪反馈——说明哪些已落地、哪些待确认、有无遗留；②客观市场动态（如原厂出厂价调整、渠道折扣率变化、新模型发布、价格异动预警等）。二者缺一不可，避免周更只报客观动态而遗漏用户侧主观变动的闭环跟踪。", "scope": "全部周更（automation-1785492937547 步骤10汇报 + 页面归纳文字）", "created_date": "2026-08-24", "related_model_id": null}, {"id": "n013", "category": "价格异动", "title": "GPT-5.6 Sol 8/21再次降价20%+；OpenAI、Google、Anthropic再次进入降价周期", "content": "OpenAI于2026-08-21宣布GPT-5.6 Sol基准价从$5/$30降至$4/$20(input -20%, output -33.3%, cache -20%)，这是OpenAI七月底(7/30)以来第二次主动降价行动；同期Terra和Luna的7/30降价仍维持($2/$12, $0.2/$1.2)；Google 8/13发布Gemini 3.7 Flash半价促销($0.75/$3.75)至2026-12-31；Anthropic取消Claude Sonnet 5原定9/1涨价至$3/$15的计划，$2/$10作为永久标准价；行业信号：美国头部AI企业从烧钱换规模阶段转向算账+份额 /* ========== 排序优先级 ========== */
const TIER_ORDER = { '旗舰': 1, '极致': 1, '主力': 2, '新版': 2, '编程': 2, '中端': 3, '高端': 3, '轻量': 4, '高效': 4, '免费/普惠': 5 };
function tierRank(t) { return TIER_ORDER[t] || 3; }

function sortInCategory(arr, primaryLabel) {
  return arr.slice().sort(function(a, b) {
    // Video cards: 按 region 国内优先
    if (a.categories && a.categories.indexOf('video') >= 0 && b.categories && b.categories.indexOf('video') >= 0) {
      const ar = a.region === '国内' ? 0 : 1;
      const br = b.region === '国内' ? 0 : 1;
      if (ar !== br) return ar - br;
    }
    // tier 优先级
    const tr = tierRank(a.tier) - tierRank(b.tier);
    if (tr !== 0) return tr;
    // 新增在末尾
    const an = a._is_new ? 1 : 0;
    const bn = b._is_new ? 1 : 0;
    if (an !== bn) return an - bn;
    // 价格升序
    const ap = a.output_usd || a.output_cny || 0;
    const bp = b.output_usd || b.output_cny || 0;
    return ap - bp;
  });
}

function fmtPrice(v) {
  if (v === null || v === undefined || v === '') return '-';
  if (typeof v === 'number') return v.toFixed(2);
  return v;
}

function discountTag(d) {
  if (d === null || d === undefined) return '<span class="discount-tag tag-gray">N/A</span>';
  if (d > 1) return '<span class="discount-tag tag-red">' + (d*100).toFixed(0) + '%</span>';
  if (d <= 0.55) return '<span class="discount-tag tag-green">' + (d*100).toFixed(0) + '%</span>';
  if (d <= 0.7) return '<span class="discount-tag tag-yellow">' + (d*100).toFixed(0) + '%</span>';
  return '<span class="discount-tag tag-blue">' + (d*100).toFixed(0) + '%</span>';
}

/* ========== 价格单位 ========== */
function billingUnitText(m) {
  const b = m.billing_unit || '1M_tokens';
  if (b === 'per_second') return '1 second (按秒)';
  if (b === 'per_generation') return 'per generation (按次)';
  return '1M tokens';
}

function getBasePrices(model) {
  if (model.region === '国内' && model.input_cny) {
    return { in: model.input_cny, out: model.output_cny, cur: '¥' };
  }
  return { in: model.input_usd, out: model.output_usd, cur: '$' };
}

function calcPlatformPrice(model, discount) {
  if (discount === null || discount === undefined) return '-';
  const base = getBasePrices(model);
  return base.cur + (base.in * discount).toFixed(2) + '/' + base.cur + (base.out * discount).toFixed(2);
}

function findBestPlatform(model) {
  let best = null;
  let bestDiscount = Infinity;
  DATA.platforms.forEach(p => {
    const pdata = model.platforms[p.id] || {};
    const d = pdata.discount;
    if (d !== null && d !== undefined && d <= 1 && d < bestDiscount) {
      bestDiscount = d;
      best = { platform: p, discount: d };
    }
  });
  return best;
}

function renderCategoryBadges(model) {
  const cats = model.categories || ['text'];
  return cats.map(function(c) {
    const meta = CAT_LABELS[c];
    if (!meta) return '';
    // Video/Coding badge 默认显示，其余标签 hover
    if (c === 'video' || c === 'coding') {
      const title = (model.category_reason || '').replace(/"/g, '&quot;');
      return '<span class="cat-badge cat-' + c + '" title="' + title + '">' + meta.icon + ' ' + meta.name + '</span>';
    } else {
      const title = (model.category_reason || '').replace(/"/g, '&quot;');
      return '<span class="cat-badge cat-' + c + '" title="' + title + '">' + meta.icon + ' ' + meta.name + '</span>';
    }
  }).join('');
}

    const tiers = model.tiers || [];
    if (tiers.length > 0) {
      tierHtml += '<div class="model-note" style="color:var(--cat-video);background:rgba(247,120,186,0.08)">🎬 ' + (model.ranking || '视频生成') + (model.native_audio ? ' · 🔊 原生音频' : '') + ' · 最高 ' + (model.max_resolution || '-') + (model.max_duration_seconds ? ' / ' + model.max_duration_seconds + 's' : '') + '</div>';
      tierHtml += '<table class="video-tier-table">' +
        '<thead><tr><th>档位</th><th>分辨率</th><th>时长</th><th style="text-align:right">CNY</th><th style="text-align:right">USD</th></tr></thead>' +
        '<tbody>';
      tiers.forEach(function(t) {
        tierHtml += '<tr>' +
          '<td style="color:var(--text)">' + (t.name || '-') + '</td>' +
          '<td>' + (t.resolution || '-') + '</td>' +
          '<td>' + (t.duration_range || '-') + '</td>' +
          '<td style="text-align:right">' + (t.price_cny != null ? '¥' + t.price_cny.toFixed(2) : '-') + '</td>' +
          '<td style="text-align:right">' + (t.price_usd != null ? '$' + t.price_usd.toFixed(3) : '-') + '</td>' +
          '</tr>';
      });
      tierHtml += '</tbody></table>';
    }

    // Connected-platform discount table (only platforms with discount data)
    const pfDict = model.platforms || {};
    const vPlats = [];
    DATA.platforms.forEach(function(p) {
      const pd = pfDict[p.id];
      if (pd && pd.discount !== null && pd.discount !== undefined) {
        vPlats.push({ id: p.id, name: p.name, data: pd });
      }
    });
    // Also include video-specific OEM channels not in the 12-platform list (e.g. minimax-api, kling-api)
    Object.keys(pfDict).forEach(function(pid) {
      if (!DATA.platforms.some(function(p) { return p.id === pid; })) {
        const pd = pfDict[pid];
        if (pd && pd.discount !== null && pd.discount !== undefined) {
          vPlats.push({ id: pid, name: pid, data: pd });
        }
      }
    });

    let platHtml = '';
    if (vPlats.length > 0) {
      // Find best discount (< 1.0)
      let bestId = null, bestD = 1.0;
      vPlats.forEach(function(v) {
        if (v.data.discount < bestD) { bestD = v.data.discount; bestId = v.id; }
      });
      const unitCn = model.billing_unit === 'per_generation' ? 'CNY/次' : 'CNY/秒';
      const unitUs = model.billing_unit === 'per_generation' ? 'USD/次' : 'USD/秒';
      platHtml += '<div class="vp-divider">渠道折扣 · 已对接 ' + vPlats.length + ' 家</div>';
      platHtml += '<table class="video-plat-table">' +
        '<thead><tr><th>平台</th><th>折扣</th><th style="text-align:right">' + unitCn + '</th><th style="text-align:right">' + unitUs + '</th></tr></thead>' +
        '<tbody>';
      vPlats.forEach(function(v) {
        const d = v.data.discount;
        const isOem = Math.abs(d - 1) < 0.0001;
        const isBest = v.id === bestId && !isOem;
        const pc = v.data.price_cny;
        const pu = v.data.price_usd;
        platHtml += '<tr' + (isBest ? ' class="vp-best-row"' : '') + '>' +
          '<td>' + v.name +
            (isOem ? '<span class="vp-oem-tag">出厂价</span>' : '') +
            (isBest ? '<span class="vp-best-tag">💰最优</span>' : '') + '</td>' +
          '<td class="' + (isBest ? 'vp-best' : '') + '">' + (d * 100).toFixed(0) + '%' + '</td>' +
          '<td style="text-align:right">' + (pc != null ? '¥' + Number(pc).toFixed(2) : '-') + '</td>' +
          '<td style="text-align:right">' + (pu != null ? '$' + Number(pu).toFixed(3) : '-') + '</td>' +
          '</tr>';
      });
      platHtml += '</tbody></table>';
    }
    platformRows = tierHtml + platHtml;
  } else {
    // Text mode price table
    const best = findBestPlatform(model);
    platformRows = DATA.platforms.map(p => {
      const pdata = model.platforms[p.id] || {};
      const d = pdata.discount;
      const priceStr = calcPlatformPrice(model, d);
      const isBest = best && best.platform.id === p.id;
      const isChanged = changedFields.platforms && changedFields.platforms[p.id];

      let rowClass = '';
      if (isBest) rowClass = 'best-row';
      else if (isChanged) rowClass = 'changed-row';

      let priceClass = '';
      if (isChanged) priceClass = 'changed-cell';

      return '' +
        '<tr class="' + rowClass + '">' +
          '<td class="platform-name">' + p.name + (isChanged ? ' <span style="color:var(--changed);font-size:9px">▲</span>' : '') + '</td>' +
          '<td>' + discountTag(d) + '</td>' +
          '<td style="text-align:right" class="' + priceClass + '">' + priceStr + '</td>' +
        '</tr>';
    }).join('');
  }

  const noteHtml = model.note ? '<div class="model-note">⚠️ ' + model.note + '</div>' : '';

  // Validation (text only)
  const priceMissing = !isVideo && (base.in === null || base.in === undefined || base.in === 0 ||
                       base.out === null || base.out === undefined || base.out === 0);
  const oemFixInfo = changedFields.oem_price_fix || changedFields.oem_price_missing || changedFields.oem_price_verified;
  const hasPriceMismatch = !!changedFields.oem_price_fix;

  // Platform count (text only)
  let allNa = false;
  let validPlatformCount = 0;
  if (!isVideo) {
    validPlatformCount = DATA.platforms.filter(p => {
      const pdata = model.platforms[p.id] || {};
      return pdata.discount !== null && pdata.discount !== undefined;
    }).length;
    allNa = validPlatformCount === 0;
  }

  // Alert badges
  let alertBadges = '';
  let alertCardClass = '';
  if (priceMissing) {
    alertBadges += '<span class="alert-badge price-missing">⚠️出厂价缺失</span>';
    alertCardClass = 'has-alert';
  }
  if (hasPriceMismatch) {
    alertBadges += '<span class="alert-badge price-mismatch">⚠️价格已修正</span>';
    alertCardClass = 'has-alert';
  }
  if (allNa && !priceMissing) {
    alertBadges += '<span class="alert-badge all-na">⚠️全渠道N/A</span>';
    if (!alertCardClass) alertCardClass = 'has-alert';
  }

  let validationNote = '';
  if (oemFixInfo) {
    if (changedFields.oem_price_fix) {
      const fix = changedFields.oem_price_fix;
      validationNote = '<div class="model-note" style="color:#ff4444">🔧 价格修正: ' + (fix.old || fix.old_cny || '') + ' → ' + (fix.new || fix.new_cny || '') + ' (' + (fix.reason || '') + ')</div>';
    } else if (changedFields.oem_price_missing) {
      validationNote = '<div class="model-note" style="color:#ff4444">⚠️ 出厂价缺失: ' + (changedFields.oem_price_missing.reason || '') + '</div>';
    } else if (changedFields.oem_price_verified) {
      const v = changedFields.oem_price_verified;
      if (v.sales_note && v.sales_note !== '一致') {
        validationNote = '<div class="model-note" style="color:#ff6600">ℹ️ 价格校验: ' + v.sales_note + '</div>';
      }
    }
  }

  const priceClass = priceMissing ? 'price-main price-warn' : (priceChanged ? 'price-main changed' : 'price-main');

  // Category reason block (inside expanded card) — only for non-coding/video
  // categories (coding/video show a persistent subtitle in the header instead)
  const reasonText = (model.category_reason || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const cats = model.categories || [];
  const hasCvCat = isVideo || cats.indexOf('coding') >= 0;
  const catReasonBlock = (reasonText && !hasCvCat) ? '' +
    '<div class="cat-reason">' +
      '<span class="cr-label">💡 分类依据</span>' + reasonText +
    '</div>' : '';

  // Persistent category reason subtitle (card header, coding/video models)
  let catSubtitle = '';
  if (hasCvCat && model.category_reason) {
    const fullTitle = String(model.category_reason).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    let short = String(model.category_reason);
    if (short.length > 80) short = short.substring(0, 80) + '…';
    short = short.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    catSubtitle = '' +
      '<div class="mc-cat-reason' + (isVideo ? ' is-video-reason' : '') + '" title="' + fullTitle + '">' +
        '<span class="mcr-label">📌 加标签理由</span>' + short +
      '</div>';
  }

  // Build category badge HTML
  const catBadges = renderCategoryBadges(model);

  // 备注关联的警告横幅（model._warning 字段）
  const warnText = model._warning || '';
  const warnRefId = model._warning_ref_note || '';
  const hasWarn = !!warnText;
  const warnCorner = hasWarn ? '<span class="mc-warn-corner" title="该模型有特别说明">⚠ 备注关联</span>' : '';
  // 警告横幅插到 mc-body 内的最上方
  const warningBanner = hasWarn ? '' +
    '<div class="mc-warning">' +
      '<span class="warn-icon">⚠️</span>' +
      '<span class="warn-text">' + String(warnText).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') + '</span>' +
      (warnRefId ? '<span class="warn-ref" data-note-id="' + warnRefId + '" title="点击跳转到对应备注">备注 ' + warnRefId + '</span>' : '') +
    '</div>' : '';

  return '' +
    '<div class="' + finalCardClass + (alertCardClass ? ' ' + alertCardClass : '') + '" data-region="' + model.region + '" data-tier="' + model.tier + '" data-open="' + model.open + '" data-id="' + model.id + '" data-isnew="' + (isNew ? '1' : '0') + '" data-categories="' + dataCats + '">' +
      warnCorner +
      '<div class="mc-header" onclick="toggleCard(this)">' +
        '<div class="mc-top-row">' +
          '<div class="mc-left">' +
            '<div class="mc-left-top">' +
              '<span class="vendor-badge ' + vendorClass + '">' + model.vendor_cn + '</span>' +
              '<span class="model-family">' + familyName + '</span>' +
              catBadges +
              newBadge +
              alertBadges +
            '</div>' +
            '<div class="mc-left-bottom">' +
              '<span class="model-tier">' + model.tier + '</span>' +
              '<span class="model-version">' + versionName + '</span>' +
            '</div>' +
            catSubtitle +
          '</div>' +
          '<div class="mc-right">' +
            '<div class="' + priceClass + '">' + base.cur + fmtPrice(base.in) + '<span style="color:var(--text-muted);font-size:11px"> / </span>' + base.cur + fmtPrice(base.out) + '</div>' +
            '<div class="price-unit">出厂价 输入/输出 · ' + billingUnitText(model) + '</div>' +
          '</div>' +
          '<div class="expand-arrow">▼</div>' +
        '</div>' +
        (bestHtml || '') +
      '</div>' +
      '<div class="mc-body">' +
        warningBanner +
        catReasonBlock +
        (isVideo ? platformRows : (
          '<table class="price-table">' +
            '<thead><tr><th>渠道</th><th>折扣</th><th style="text-align:right">实际价格</th></tr></thead>' +
            '<tbody>' + platformRows + '</tbody>' +
          '</table>'
        )) +
        noteHtml +
        validationNote +
      '</div>' +
    '</div>';
}

/* ========== Watch 卡片渲染 ========== */
function renderWatchModel(model, idx) {
  const base = getBasePrices(model);
  const vendorClass = 'v-' + model.vendor;
  const isNew = model._is_new === true;
  const cardClass = isNew ? 'model-card watch-list is-new' : 'model-card watch-list';
  const newBadge = isNew ? '<span class="new-badge">NEW</span>' : '';

  var dashIdx = model.id.indexOf('-');
  var familyName = dashIdx >= 0 ? model.id.substring(0, dashIdx) : model.id;
  var versionName = dashIdx >= 0 ? model.id.substring(dashIdx + 1) : '';

  const addDate = model._added_to_watch || model._added_date || DATA.update_time.split(' ')[0];
  const promoteDate = model._auto_promote_date || '';
  const addTime = new Date(addDate.replace(/-/g, '/'));
  const nowTime = new Date();
  const watchDays = Math.max(0, Math.floor((nowTime - addTime) / (1000*60*60*24)));
  const daysLeft = promoteDate ? Math.max(0, Math.ceil((new Date(promoteDate.replace(/-/g, '/')) - nowTime) / (1000*60*60*24))) : 7 - watchDays;

  const best = findBestPlatform(model);
  const bestHtml = best ? '' +
    '<div class="mc-best-row">' +
      '<span class="best-icon">💰</span>' +
      '<span class="best-label">最低渠道</span>' +
      '<span class="best-channel">' + best.platform.name + '</span>' +
      '<span class="best-discount">' + (best.discount * 100).toFixed(0) + '%</span>' +
      '<span class="best-price">' + calcPlatformPrice(model, best.discount) + '</span>' +
      '<span class="expand-hint">点击查看全部 ▼</span>' +
    '</div>' : '';

  const platformRows = DATA.platforms.map(p => {
    const pdata = model.platforms[p.id] || {};
    const d = pdata.discount;
    const priceStr = calcPlatformPrice(model, d);
    const isBest = best && best.platform.id === p.id;
    let rowClass = isBest ? 'best-row' : '';
    return '' +
      '<tr class="' + rowClass + '">' +
        '<td class="platform-name">' + p.name + '</td>' +
        '<td>' + discountTag(d) + '</td>' +
        '<td style="text-align:right">' + priceStr + '</td>' +
      '</tr>';
  }).join('');

  const noteHtml = model.note ? '<div class="model-note">⚠️ ' + model.note + '</div>' : '';
  const watchDaysHtml = '' +
    '<div class="watch-days">' +
      '⏳ 已观察 <span class="countdown">' + watchDays + '</span> 天' +
      (daysLeft > 0 ? ' · 剩余 <span class="countdown">' + daysLeft + '</span> 天' : '') +
      (daysLeft <= 0 ? ' <span class="auto-promote">→ 下次周更纳入正式清单</span>' : '') +
    '</div>';

  return '' +
    '<div class="' + cardClass + '" data-region="' + model.region + '" data-tier="' + model.tier + '" data-open="' + model.open + '" data-id="' + model.id + '" data-isnew="' + (isNew ? '1' : '0') + '">' +
      '<div class="mc-header" onclick="toggleCard(this)">' +
        '<div class="mc-top-row">' +
          '<div class="mc-left">' +
            '<div class="mc-left-top">' +
              '<span class="vendor-badge ' + vendorClass + '">' + model.vendor_cn + '</span>' +
              '<span class="model-family">' + familyName + '</span>' +
              renderCategoryBadges(model) +
              newBadge +
            '</div>' +
            '<div class="mc-left-bottom">' +
              '<span class="model-tier">' + model.tier + '</span>' +
              '<span class="model-version">' + versionName + '</span>' +
              '<span class="watch-badge">👁️ 观察中</span>' +
            '</div>' +
          '</div>' +
          '<div class="mc-right">' +
            '<div class="price-main">' + base.cur + fmtPrice(base.in) + '<span style="color:var(--text-muted);font-size:11px"> / </span>' + base.cur + fmtPrice(base.out) + '</div>' +
            '<div class="price-unit">出厂价 输入/输出 · ' + billingUnitText(model) + '</div>' +
          '</div>' +
          '<div class="expand-arrow">▼</div>' +
        '</div>' +
        bestHtml +
      '</div>' +
      '<div class="mc-body">' +
        (model.category_reason ? '<div class="cat-reason"><span class="cr-label">💡 分类依据</span>' + model.category_reason.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' : '') +
        '<table class="price-table">' +
          '<thead><tr><th>渠道</th><th>折扣</th><th style="text-align:right">实际价格</th></tr></thead>' +
          '<tbody>' + platformRows + '</tbody>' +
        '</table>' +
        watchDaysHtml +
        noteHtml +
      '</div>' +
    '</div>';
}

}

/* ========== per-unit 卡片渲染 (图片 per_image / 语音 per_10k_chars / 视频 per_second 单价) ========== */
function renderPerUnitCard(model) {
  const t = (model.platforms || {}).tmax || {};
  const usd = t.tmax_out_usd;
  const cny = t.tmax_out_cny;
  const billing = model.billing_unit || 'per_image';
  const billingLabelMap = { per_image: '/张', per_10k_chars: '/万字符', per_second: '/秒' };
  const billingLabel = billingLabelMap[billing] || ('/' + billing);
  const cats = model.categories || [];
  const isNew = model._is_new === true;
  const cardClass = 'model-card is-perunit';
  const finalCardClass = isNew ? cardClass + ' is-new' : cardClass;
  const newBadge = isNew ? '<span class="new-badge">NEW</span>' : '';
  const dataCats = cats.join(',');

  const badges = cats.map(function (c) {
    const meta = CAT_LABELS[c];
    if (!meta) return '';
    const title = (model.category_reason || '').replace(/"/g, '&quot;');
    return '<span class="cat-badge cat-' + c + '" title="' + title + '">' + meta.icon + ' ' + meta.name + '</span>';
  }).join('');

  const discount = t.tmax_discount_rate;
  const discountText = (discount == null || discount === undefined) ? '-'
    : (discount >= 0.999 ? '无折扣(Custom)'
    : (discount <= 0.5001 ? '50% OFF'
    : (Math.abs(discount - 0.6) < 0.01 ? '40% OFF'
    : ((1 - discount) * 100).toFixed(0) + '% OFF')));

  const fmtNum = function (v) {
    if (v == null) return '-';
    return v.toFixed(4).replace(/\.?0+$/, '');
  };

  let priceLine = '';
  if (usd != null) {
    priceLine = '<div class="mc-price-row" style="margin:8px 0 4px">' +
      '<span style="font-size:20px;font-weight:800;color:var(--accent)">¥' + fmtNum(cny) + '</span>' +
      '<span style="font-size:11px;color:var(--text-dim);margin-left:6px">' + billingLabel + '</span>' +
      '<span style="font-size:11px;color:var(--text-dim);margin-left:8px">($' + fmtNum(usd) + ')</span>' +
      '<span style="font-size:10px;margin-left:8px;padding:2px 6px;border-radius:4px;background:rgba(63,185,80,0.15);color:var(--green)">' + discountText + '</span>' +
    '</div>';
  } else {
    priceLine = '<div class="mc-price-row" style="margin:8px 0 4px;color:var(--text-dim)">价格缺失</div>';
  }

  return '<div class="' + finalCardClass + '" data-id="' + model.id + '" data-categories="' + dataCats + '" data-billing="' + billing + '">' +
    '<div class="mc-header">' +
      '<div class="mc-title">' +
        '<span class="mc-name">' + model.name + '</span>' + newBadge +
        '<span class="mc-vendor">' + (model.vendor_cn || model.vendor) + '</span>' +
      '</div>' +
      '<div class="mc-meta">' +
        '<span class="model-tier">' + model.tier + '</span>' +
        badges +
      '</div>' +
    '</div>' +
    priceLine +
    '<div class="mc-info-row" style="font-size:11px;color:var(--text-dim);margin-top:2px">批发渠道: <b style="color:var(--text)">TMax</b>（公开渠道报价）</div>' +
    '<div class="mc-info-row" style="font-size:10px;color:var(--text-dim);margin-top:2px">OEM 出厂价: 缺失(渠道报价未列, 待各厂商官网公开)</div>' +
  '</div>';
}

/* ========== 主渲染函数 ========== */
function render(filter) {
  filter = filter || 'all';
  const list = document.getElementById('modelList');
  const explainerEl = document.getElementById('categoryExplainerContainer');
  explainerEl.innerHTML = renderCategoryExplainer(filter);

  let models = DATA.hot_models;

  if (filter === 'watch') {
    const watchIntl = watchModels.filter(m => m.region === '国际');
    const watchDom = watchModels.filter(m => m.region === '国内');

        html += watchIntl.map(renderWatchModel).join('');

        html += '<div class="section-title">🇨🇳 国内 · 待观察 <span class="new-count">' + watchDom.length + '</span></div>';
        html += watchDom.map(renderWatchModel).join('');
      }
    }
    list.innerHTML = html;
    updateSummary();
    return;
  }

  // ========== 平台/系统 子项（独立品类，与模型 Token 价分离） ==========
  if (filter === 'platform') {
    list.innerHTML = renderPlatformPanel(DATA.platform_products || [], DATA.platform_meta || {});
    updateSummary();
    return;
  }

  // ========== 备注子项 ==========
  if (filter === 'notes') {
    const notes = DATA.notes || [];
    list.innerHTML = renderNotesPanel(notes);
    updateSummary();
    return;
  }

  // ========== 官网列表 子项 ==========
  if (filter === 'guanwang') {
    list.innerHTML = renderGuanwangPanel();
    updateSummary();
    return;
  }

  // ========== Coding 子项 ==========
  if (filter === 'coding') {
    const codingModels = models.filter(m => (m.categories || []).indexOf('coding') >= 0);
    const sorted = sortInCategory(codingModels);
    const intl = sorted.filter(m => m.region === '国际');
    const dom = sorted.filter(m => m.region === '国内');

    let html = '';
    if (intl.length) {
      html += '<div class="section-title">🌐 国际 Coding 模型 <span class="new-count">' + intl.length + '</span></div>';
      html += intl.map(renderModel).join('');
    }
    if (dom.length) {
      html += '<div class="section-title">🇨🇳 国内 Coding 模型 <span class="new-count">' + dom.length + '</span></div>';
      html += dom.map(renderModel).join('');
    }
    if (sorted.length === 0) {
      html = '<div class="empty-state"><div class="emoji">💻</div>暂无 Coding 子项收录模型</div>';
    }
    list.innerHTML = html;
    updateSummary();
    return;
  }

  // ========== Video 子项 ==========
  if (filter === 'video') {
    const videoModels = models.filter(m => (m.categories || []).indexOf('video') >= 0);
    const sorted = sortInCategory(videoModels, 'video');
    const intl = sorted.filter(m => m.region === '国际');
    const dom = sorted.filter(m => m.region === '国内');

    let html = '';
    if (dom.length) {
      html += '<div class="section-title">🇨🇳 国内视频模型 <span class="new-count">' + dom.length + '</span></div>';
      html += dom.map(renderModel).join('');
    }
    if (intl.length) {
      html += '<div class="section-title">🌐 国际视频模型 <span class="new-count">' + intl.length + '</span></div>';
      html += intl.map(renderModel).join('');

  // ========== Image 子项 ==========

      const au = ((a.platforms || {}).tmax || {}).tmax_out_usd;
      const bu = ((b.platforms || {}).tmax || {}).tmax_out_usd;
      if (au == null && bu == null) return 0;
      if (au == null) return 1;
      if (bu == null) return -1;
      return au - bu;
    });

    if (sorted.length) {
      html += '<div class="section-title">🖼️ 图片生成模型 <span class="new-count">' + sorted.length + '</span></div>';

    updateSummary();

  // ========== Audio 子项 ==========
  if (filter === 'audio') {
    const audioModels = models.filter(m => (m.categories || []).indexOf('audio') >= 0);
    const sorted = audioModels.slice().sort(function(a, b) {
      const au = ((a.platforms || {}).tmax || {}).tmax_out_usd;
      const bu = ((b.platforms || {}).tmax || {}).tmax_out_usd;
      if (au == null && bu == null) return 0;
      if (au == null) return 1;
      if (bu == null) return -1;
      return au - bu;
    });

    if (sorted.length) {
      html += '<div class="section-title">🎵 语音合成模型 <span class="new-count">' + sorted.length + '</span></div>';
      html += sorted.map(renderPerUnitCard).join('');

    }

    updateSummary();
    return;
  }

  // ========== Vidu 子项 ==========
  if (filter === 'vidu') {
    const viduModels = models.filter(m => (m.categories || []).indexOf('vidu') >= 0);
    const sorted = viduModels.slice().sort(function(a, b) {
      const au = ((a.platforms || {}).tmax || {}).tmax_out_usd;
      const bu = ((b.platforms || {}).tmax || {}).tmax_out_usd;
      if (au == null && bu == null) return 0;
      if (au == null) return 1;
      if (bu == null) return -1;
      return au - bu;
    });
    let html = '';
    if (sorted.length) {
      html += '<div class="section-title">🎬 Vidu 系列模型 <span class="new-count">' + sorted.length + '</span></div>';
      html += sorted.map(renderPerUnitCard).join('');
    } else {
      html = '<div class="empty-state"><div class="emoji">🎬</div>暂无 Vidu 收录模型</div>';
    }
    list.innerHTML = html;
    updateSummary();
    return;
  }

  // ========== 全部/区域/tier/open 过滤 ==========
  if (filter !== 'all') {
    if (filter === 'new') {
      models = models.filter(m => m._is_new === true);
    } else {
      models = models.filter(m =>
        m.region === filter || m.tier === filter || m.open === filter
      );
    }
  }

  // 分离文本 / 视频 / 图片 / 语音 (textModels 不含 video/image/audio, 它们各有子栏目)
  const textModels = models.filter(m => {
    const c = m.categories || [];
    return c.indexOf('video') < 0 && c.indexOf('image') < 0 && c.indexOf('audio') < 0;
  });
  const videoModels = models.filter(m => (m.categories || []).indexOf('video') >= 0);
  const imageModels = models.filter(m => (m.categories || []).indexOf('image') >= 0);
  const audioModels = models.filter(m => (m.categories || []).indexOf('audio') >= 0);

  const intl = textModels.filter(m => m.region === '国际');
  const dom = textModels.filter(m => m.region === '国内');
  const vIntl = videoModels.filter(m => m.region === '国际');
  const vDom = videoModels.filter(m => m.region === '国内');

  const newIntlCount = intl.filter(m => m._is_new).length;
  const newDomCount = dom.filter(m => m._is_new).length;

  let html = '';
  if (intl.length) {
    html += '<div class="section-title">🌐 国际文本模型';
    if (newIntlCount > 0) html += ' <span class="new-count">+' + newIntlCount + ' 新增</span>';

    html += intl.map(renderModel).join('');

    if (newDomCount > 0) html += ' <span class="new-count">+' + newDomCount + ' 新增</span>';
    html += '</div>';
    html += dom.map(renderModel).join('');
  }

  // 视频部分（仅在不过滤 watch 时显示）
  if (filter !== 'new' && (vDom.length || vIntl.length)) {
    html += '<hr class="watch-divider" style="border-top:2px dashed rgba(247,120,186,0.3)">' +

      html += '<div class="section-title" style="color:var(--cat-video)">🇨🇳 国内视频模型 <span style="font-size:10px">' + vDom.length + ' 个</span></div>';

    }

      html += vIntl.map(renderModel).join('');

    html += '<hr class="watch-divider" style="border-top:2px dashed rgba(167,139,250,0.3)">' +

            '</div>';
    html += '<div class="section-title" style="color:var(--cat-image)">🖼️ 图片模型 <span style="font-size:10px">' + imageModels.length + ' 个 (TMax 渠道)</span></div>';
    html += imageModels.map(renderPerUnitCard).join('');
  }

  // 语音合成模型区块
  if (filter !== 'new' && audioModels.length) {
    html += '<hr class="watch-divider" style="border-top:2px dashed rgba(251,146,60,0.3)">' +
            '<div style="position:relative;height:0">' +
            '<div style="position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--cat-audio);background:var(--bg);padding:0 12px;white-space:nowrap">🎵 语音合成模型 · 按 1 万字符计费</div>' +
            '</div>';
    html += '<div class="section-title" style="color:var(--cat-audio)">🎵 语音模型 <span style="font-size:10px">' + audioModels.length + ' 个 (TMax 渠道)</span></div>';
    html += audioModels.map(renderPerUnitCard).join('');
  }

  // Watch list
  if (filter !== 'new' && watchModels.length > 0) {
    const watchIntl = watchModels.filter(m => m.region === '国际');
    const watchDom = watchModels.filter(m => m.region === '国内');
    if (watchIntl.length || watchDom.length) {
      html += '<hr class="watch-divider">';

    if (watchIntl.length) {
      html += '<div class="section-title">🌐 国际 · 待观察 <span style="font-size:10px;color:var(--accent);">+观察期7天</span></div>';
      html += watchIntl.map(renderWatchModel).join('');
    }
    if (watchDom.length) {
      html += '<div class="section-title">🇨🇳 国内 · 待观察 <span style="font-size:10px;color:var(--accent);">+观察期7天</span></div>';
      html += watchDom.map(renderWatchModel).join('');
    }
  }

  if (!html) {
    html = '<div class="empty-state"><div class="emoji">🔍</div>暂无匹配模型</div>';
  }

  list.innerHTML = html;
  updateSummary();
}

function updateSummary() {
  const allDiscounts = [];
  const channelWins = {};
  DATA.hot_models.forEach(m => {
    // 跳过视频模型，因计费单位不同
    if ((m.categories || []).indexOf('video') >= 0) return;
    const best = findBestPlatform(m);
    if (best) {
      allDiscounts.push(best.discount);
      const pname = best.platform.name;
      channelWins[pname] = (channelWins[pname] || 0) + 1;
    }
  });
  if (allDiscounts.length > 0) {
    const minD = Math.min.apply(null, allDiscounts);
    const avgD = allDiscounts.reduce(function(a,b){return a+b;}, 0) / allDiscounts.length;
    document.getElementById('minDiscount').textContent = (minD * 100).toFixed(0) + '%';
    document.getElementById('avgDiscount').textContent = (avgD * 100).toFixed(0) + '%';
  }
  let topChannel = '--';
  let topCount = 0;
  Object.keys(channelWins).forEach(function(name) {
    if (channelWins[name] > topCount) { topChannel = name; topCount = channelWins[name]; }
  });
  document.getElementById('bestChannel').textContent = topChannel;
}

function renderPlatformPanel(products, meta) {
  if (!products || products.length === 0) {

  }
  // 按渠道商分组

  products.forEach(p => {

    (byVendor[v] = byVendor[v] || []).push(p);
  });

    const items = byVendor[v];
    return '' +
      '<div class="platform-vendor-group">' +
        '<div class="platform-vendor-title">🏢 ' + esc(v) +
          ' <span class="vcount">' + items.length + ' 个版本</span>' +
        '</div>' +
        '<div class="platform-cards">' + items.map(renderPlatformCard).join('') + '</div>' +
      '</div>';
  }).join('');

  const rules = (meta.rules || []).map(r => '<li>' + esc(r) + '</li>').join('');

  return '' +
    '<div class="platform-panel">' +
      '<div class="platform-header">' +
        '<h2>' + esc(meta.icon || '🖥️') + ' ' + esc(meta.category_name || '平台/系统') + '</h2>' +

function renderNotesPanel(notes) {
  if (!notes || notes.length === 0) {
    return '<div class="empty-state"><div class="emoji">📝</div>暂无备注</div>';
  }
  // 按类目分组统计
  const catCount = {};
  notes.forEach(n => {
    const c = n.category || '其他';
    catCount[c] = (catCount[c] || 0) + 1;
  });
  const summaryChips = Object.keys(catCount).map(c =>
    '<span class="notes-summary-chip">' + c + ' · ' + catCount[c] + '</span>'
  ).join('');

  const cards = notes.map(n => {
    const catClass = 'cat-' + (n.category === '计量方法' ? 'method' : n.category === '观察窗口' ? 'warning' : 'other');
    const tagText = String(n.category || '其他');
    const id = String(n.id || '').replace(/</g, '&lt;');
    const title = String(n.title || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const content = String(n.content || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const date = String(n.created_date || '').replace(/</g, '&lt;');
    const scope = String(n.scope || '').replace(/</g, '&lt;');
    const relatedId = n.related_model_id || '';
    const refNote = n.related_warning ? '<span class="note-related-link" data-related-model="' + relatedId + '">↗ 查看模型卡片警告</span>' : '';
    return '' +
      '<div class="note-card ' + catClass + '" id="' + id + '">' +
        '<div class="note-card-head">' +
          '<span class="note-tag">' + tagText + '</span>' +
          '<span class="note-id">' + id + '</span>' +
          '<span class="note-date">📅 ' + date + '</span>' +
        '</div>' +
        '<div class="note-title">' + title + refNote + '</div>' +
        '<div class="note-content">' + content + '</div>' +
        (scope ? '<div class="note-scope"><span class="scope-label">适用范围：</span>' + scope + '</div>' : '') +
      '</div>';
  }).join('');

  return '' +
    '<div class="notes-panel">' +
      '<div class="notes-header">' +
        '<h2>📝 备注</h2>' +
        '<p>用于沉淀持续性、跨模型、跨渠道的事项说明——计量方法、可能引起疑问的特例、需长期备忘的内容。每条备注独立成卡，便于随时查阅与累积。</p>' +
        '<div class="notes-summary">' + summaryChips + '</div>' +
      '</div>' +
      cards +
    '</div>';

/* 备注 ↔ 模型卡片的交叉跳转（事件委托） */
document.addEventListener('click', function(e) {
  // 1) 警告横幅的"备注 xxxx"链接 → 切到备注 Tab 并滚动到对应卡片
  const warnRef = e.target.closest('.warn-ref');
  if (warnRef) {
    e.stopPropagation();
    const noteId = warnRef.dataset.noteId;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const notesTab = document.querySelector('.tab[data-filter="notes"]');
    if (notesTab) notesTab.classList.add('active');
    render('notes');
    setTimeout(() => {
      const target = document.getElementById(noteId);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.style.outline = '2px solid #ff9b3d';
        target.style.outlineOffset = '4px';
        setTimeout(() => { target.style.outline = ''; target.style.outlineOffset = ''; }, 2200);
      }
    }, 60);
    return;
  }
  // 2) 备注里的"↗ 查看模型卡片警告"链接 → 切到全部 Tab 并定位/展开模型卡片
  const noteLink = e.target.closest('.note-related-link');
  if (noteLink) {
    e.stopPropagation();
    const modelId = noteLink.dataset.relatedModel;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.tab[data-filter="all"]').classList.add('active');
    render('all');
    setTimeout(() => {
      const card = document.querySelector('.model-card[data-id="' + modelId + '"]');
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('expanded');
        card.style.outline = '2px solid #ff9b3d';
        card.style.outlineOffset = '4px';
        setTimeout(() => { card.style.outline = ''; card.style.outlineOffset = ''; }, 2200);
      }
    }, 80);
  }
});
