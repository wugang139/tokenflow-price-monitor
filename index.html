<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" "black-translucent">
<title>TokenFlow 热门模型价格监控</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --card-hover: #1c2330;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #7d8590;
  --text-muted: #484f58;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --orange: #db6d28;
  --purple: #bc8cff;
  --pink: #f778ba;
  --teal: #39d0d8;
  --gold: #e3b341;
  --changed: #f85149;
  --changed-bg: rgba(248,81,73,0.08);
  --changed-border: rgba(248,81,73,0.35);
  --new-badge: #f85149;
  /* Category colors */
  --cat-coding: #58a6ff;
  --cat-coding-bg: rgba(88,166,255,0.15);
  --cat-video: #f778ba;
  --cat-video-bg: rgba(247,120,186,0.18);
  --cat-reasoning: #bc8cff;
  --cat-reasoning-bg: rgba(188,140,255,0.15);
  --cat-multimodal: #39d0d8;
  --cat-multimodal-bg: rgba(57,208,216,0.15);
  --cat-audio: #fb923c;
  --cat-audio-bg: rgba(251,146,60,0.15);
  --cat-open: #3fb950;
  --cat-open-bg: rgba(63,185,80,0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 90px;
}
/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,17,23,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 8px;
}
.header h1 {
  font-size: 18px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}
.header h1 .emoji { font-size: 20px; }
.header .meta {
  font-size: 11px; color: var(--text-dim);
  margin-top: 4px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.header .meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Change banner */
.change-banner {
  margin: 6px 12px;
  padding: 8px 12px;
  background: var(--changed-bg);
  border: 1px solid var(--changed-border);
  border-radius: 10px;
  display: flex; align-items: flex-start; gap: 8px;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.change-banner .cb-icon { font-size: 16px; flex-shrink: 0; }
.change-banner .cb-content { flex: 1; min-width: 0; }
.change-banner .cb-title { font-size: 13px; font-weight: 700; color: var(--changed); }
.change-banner .cb-detail { font-size: 11px; color: var(--text-dim); margin-top: 2px; line-height: 1.6; }
.change-banner .cb-detail .hl { color: var(--changed); font-weight: 600; }
.change-banner .cb-close {
  font-size: 14px; color: var(--text-muted); cursor: pointer;
  flex-shrink: 0; padding: 0 4px;
}

/* Filter tabs */
.tabs {
  display: flex; gap: 6px; padding: 8px 16px 4px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 5px 12px; border-radius: 16px;
  font-size: 12px; font-weight: 600;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer; transition: all 0.2s;
}
.tab.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.tab .tab-count { font-size: 10px; opacity: 0.7; margin-left: 2px; }
.tab.tab-coding.active { background: var(--cat-coding); border-color: var(--cat-coding); }
.tab.tab-video.active { background: var(--cat-video); border-color: var(--cat-video); }

/* Category explainer banner */
.category-explainer {
  margin: 6px 12px;
  padding: 10px 12px;
  background: rgba(88,166,255,0.06);
  border: 1px dashed rgba(88,166,255,0.25);
  border-radius: 10px;
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.6;
}
.category-explainer .ce-title {
  font-size: 12px; font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.category-explainer .ce-tags {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 6px;
}
.category-explainer .ce-sort {
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid rgba(88,166,255,0.1);
  font-size: 10px;
  color: var(--text-muted);
}
.category-explainer .ce-sort b { color: var(--text-dim); font-weight: 600; }

/* Section title */
.section-title {
  font-size: 13px; font-weight: 700; color: var(--text-dim);
  padding: 12px 16px 6px;
  text-transform: uppercase; letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 6px;
}
.section-title .new-count {
  font-size: 11px; padding: 1px 6px; border-radius: 8px;
  background: var(--changed-bg); color: var(--changed); font-weight: 700;
}

/* Model card */
.model-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin: 6px 12px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.model-card:active { border-color: var(--accent); }
.model-card.expanded { border-color: var(--accent); }

/* New model card - special border */
.model-card.is-new {
  border-color: var(--changed-border);
  border-width: 1px;
  position: relative;
}
.model-card.is-new::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--changed), var(--orange));
  border-radius: 12px 12px 0 0;
}

/* Video card variant */
.model-card.is-video {
  border-color: rgba(247,120,186,0.25);
}
.model-card.is-video.is-new::before {
  background: linear-gradient(90deg, var(--cat-video), var(--purple));
}

.mc-header {
  padding: 10px 14px;
  cursor: pointer;
}
.mc-top-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.mc-left { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.mc-left-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mc-left-bottom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px;}
.vendor-badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 4px;
  white-space: nowrap;
}
.model-family {
  font-size: 14px; font-weight: 600;
  white-space: nowrap;
}
.model-version {
  font-size: 12px; font-weight: 500; color: var(--text-dim);
  white-space: nowrap;
}
.model-tier {
  font-size: 10px; color: var(--text-dim);
  white-space: nowrap;
}
/* Persistent category reason subtitle (card header, coding/video models) */
.mc-cat-reason {
  margin-top: 5px;
  padding: 3px 8px;
  border-left: 3px solid var(--cat-coding);
  border-radius: 4px;
  background: rgba(88,166,255,0.06);
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.45;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: help;
}
.mc-cat-reason.is-video-reason {
  border-left-color: var(--cat-video);
  background: rgba(247,120,186,0.06);
}
.mc-cat-reason .mcr-label {
  font-size: 9px; font-weight: 800;
  color: var(--cat-coding);
  margin-right: 5px;
}
.mc-cat-reason.is-video-reason .mcr-label { color: var(--cat-video); }

.new-badge {
  font-size: 9px; font-weight: 800;
  padding: 1px 5px; border-radius: 3px;
  background: var(--new-badge); color: #fff;
  margin-left: 4px;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.6} }

/* Category badges */
.cat-badge {
  font-size: 9px; font-weight: 700;
  padding: 1px 6px; border-radius: 8px;
  cursor: help;
  display: inline-flex; align-items: center; gap: 2px;
  white-space: nowrap;
}
.cat-badge.cat-coding { background: var(--cat-coding-bg); color: var(--cat-coding); border: 1px solid rgba(88,166,255,0.3); }
.cat-badge.cat-video { background: var(--cat-video-bg); color: var(--cat-video); border: 1px solid rgba(247,120,186,0.3); }
.cat-badge.cat-reasoning { background: var(--cat-reasoning-bg); color: var(--cat-reasoning); border: 1px solid rgba(188,140,255,0.3); }
.cat-badge.cat-multimodal { background: var(--cat-multimodal-bg); color: var(--cat-multimodal); border: 1px solid rgba(57,208,216,0.3); }
.cat-badge.cat-audio { background: var(--cat-audio-bg); color: var(--cat-audio); border: 1px solid rgba(251,146,60,0.3); }
.cat-badge.cat-open { background: var(--cat-open-bg); color: var(--cat-open); border: 1px solid rgba(63,185,80,0.3); }

.mc-right {
  display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
}
.price-main {
  font-size: 15px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.price-unit { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

/* Changed price highlight */
.price-main.changed {
  color: var(--changed);
}
/* Price warning (missing/zero/mismatch) */
.price-main.price-warn {
  color: #ff4444;
}
.alert-badge {
  font-size: 9px; font-weight: 800;
  padding: 1px 5px; border-radius: 3px;
  background: #ff4444; color: #fff;
  margin-left: 4px;
  white-space: nowrap;
}
.alert-badge.all-na { background: #ff6600; }
.alert-badge.price-missing { background: #cc0000; }
.alert-badge.price-mismatch { background: #ff4444; }
.model-card.has-alert {
  border-left: 3px solid #ff4444;
}
.price-main.changed::after {
  content: ' \25B2'; font-size: 10px; color: var(--changed);
}

/* Best channel row */
.mc-best-row {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px;
  padding: 6px 8px;
  background: rgba(63,185,80,0.08);
  border: 1px solid rgba(63,185,80,0.2);
  border-radius: 8px;
}
.mc-best-row .best-icon { font-size: 14px; }
.mc-best-row .best-label {
  font-size: 11px; color: var(--text-dim); font-weight: 500;
}
.mc-best-row .best-channel {
  font-size: 13px; font-weight: 700; color: var(--green);
}
.mc-best-row .best-discount {
  font-size: 14px; font-weight: 800; color: var(--green);
  font-variant-numeric: tabular-nums;
  margin-left: auto;
}
.mc-best-row .best-price {
  font-size: 11px; color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.mc-best-row .expand-hint {
  font-size: 11px; color: var(--text-muted);
  margin-left: 4px;
}
.mc-body {
  display: none;
  padding: 0 14px 12px;
  border-top: 1px solid var(--border);
}
.model-card.expanded .mc-body { display: block; }

/* Category reason block (inside expanded card) */
.cat-reason {
  margin: 8px 0 6px;
  padding: 6px 10px;
  background: rgba(88,166,255,0.05);
  border-left: 2px solid var(--accent);
  border-radius: 4px;
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.55;
}
.cat-reason .cr-label {
  font-size: 10px; font-weight: 700;
  color: var(--accent);
  margin-right: 4px;
}

/* Video tier table */
.video-tier-table {
  width: 100%; margin-top: 6px;
  border-collapse: collapse;
  font-size: 11px;
}
.video-tier-table th {
  text-align: left; font-weight: 600;
  color: var(--text-dim); padding: 4px;
  border-bottom: 1px solid var(--border);
  font-size: 10px;
}
.video-tier-table td {
  padding: 4px;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  font-variant-numeric: tabular-nums;
}
.video-tier-table tr:last-child td { border-bottom: none; }

/* Video platform discount table (connected platforms only) */
.vp-divider {
  display: flex; align-items: center; gap: 8px;
  margin: 12px 0 4px;
  font-size: 10px; color: var(--text-muted); font-weight: 700;
  white-space: nowrap;
}
.vp-divider::before, .vp-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.video-plat-table {
  width: 100%; margin-top: 4px;
  border-collapse: collapse;
  font-size: 11px;
}
.video-plat-table th {
  text-align: left; font-weight: 600;
  color: var(--text-dim); padding: 4px;
  border-bottom: 1px solid var(--border);
  font-size: 10px;
}
.video-plat-table td {
  padding: 4px;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  font-variant-numeric: tabular-nums;
}
.video-plat-table tr:last-child td { border-bottom: none; }
.video-plat-table .vp-best { color: var(--green); font-weight: 800; }
.video-plat-table tr.vp-best-row td { background: rgba(63,185,80,0.06); }
.vp-oem-tag {
  font-size: 8px; font-weight: 700;
  padding: 1px 4px; border-radius: 3px;
  background: rgba(63,185,80,0.15); color: var(--green);
  margin-left: 3px;
}
.vp-best-tag {
  font-size: 8px; font-weight: 700;
  margin-left: 3px;
}

/* Price detail table */
.price-table {
  width: 100%; margin-top: 8px;
  border-collapse: collapse;
  font-size: 12px;
}
.price-table th {
  text-align: left; font-weight: 600;
  color: var(--text-dim); padding: 6px 4px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}
.price-table td {
  padding: 6px 4px;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  font-variant-numeric: tabular-nums;
}
.price-table tr:last-child td { border-bottom: none; }
.price-table .platform-name { color: var(--text); font-weight: 500; }
.price-table tr.best-row {
  background: rgba(63,185,80,0.08);
}
.price-table tr.best-row .platform-name {
  color: var(--green); font-weight: 700;
}
.price-table tr.best-row td:first-child::before {
  content: '\2605 '; color: var(--gold);
}

/* Changed platform row highlight */
.price-table tr.changed-row {
  background: var(--changed-bg);
}
.price-table tr.changed-row td {
  color: var(--changed);
}
.price-table tr.changed-row .platform-name {
  color: var(--changed); font-weight: 600;
}
.price-table td.changed-cell {
  color: var(--changed); font-weight: 700;
}

.price-table .discount-tag {
  display: inline-block;
  font-size: 10px; font-weight: 700;
  padding: 1px 5px; border-radius: 3px;
}
.tag-green { background: rgba(63,185,80,0.15); color: var(--green); }
.tag-yellow { background: rgba(210,153,34,0.15); color: var(--yellow); }
.tag-red { background: rgba(248,81,73,0.15); color: var(--red); }
.tag-gray { background: rgba(125,133,144,0.15); color: var(--text-dim); }
.tag-blue { background: rgba(88,166,255,0.15); color: var(--accent); }

/* Note */
.model-note {
  font-size: 11px; color: var(--yellow);
  margin-top: 6px; padding: 4px 8px;
  background: rgba(210,153,34,0.08);
  border-radius: 4px;
}

/* Summary bar */
.summary-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13,17,23,0.92);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  padding: 8px 16px;
  display: flex; justify-content: space-around;
  z-index: 100;
}
.summary-item {
  text-align: center;
}
.summary-item .label { font-size: 10px; color: var(--text-dim); }
.summary-item .value { font-size: 14px; font-weight: 700; }

/* Region colors */
.r-international { background: rgba(88,166,255,0.15); color: var(--accent); }
.r-domestic { background: rgba(63,185,80,0.15); color: var(--green); }

/* Vendor colors - existing */
.v-Anthropic { background: rgba(210,153,34,0.2); color: var(--yellow); }
.v-OpenAI { background: rgba(63,185,80,0.15); color: var(--green); }
.v-Google { background: rgba(66,133,244,0.2); color: #4285f4; }
.v-xAI { background: rgba(255,255,255,0.1); color: #ccc; }
.v-DeepSeek { background: rgba(63,185,80,0.15); color: var(--green); }
.v-Zhipu { background: rgba(91,33,182,0.25); color: var(--purple); }
.v-MoonshotAI { background: rgba(247,120,186,0.15); color: var(--pink); }
.v-Alibaba { background: rgba(255,125,0,0.15); color: var(--orange); }
.v-ByteDance { background: rgba(255,45,85,0.15); color: #ff2d55; }
.v-MiniMax { background: rgba(57,208,216,0.15); color: var(--teal); }
.v-Tencent { background: rgba(35,188,238,0.2); color: #23bcee; }
.v-Kuaishou { background: rgba(255,87,34,0.2); color: #ff5722; }

/* Vendor colors - new */
.v-Meta { background: rgba(8,131,230,0.2); color: #0883e6; }
.v-Mistral { background: rgba(255,107,53,0.2); color: #ff6b35; }
.v-Cohere { background: rgba(114,137,218,0.2); color: #7289da; }
.v-Perplexity { background: rgba(168,85,247,0.2); color: #a855f7; }
.v-Baidu { background: rgba(37,99,235,0.2); color: #2563eb; }
.v-iFlytek { background: rgba(234,88,12,0.2); color: #ea580c; }
.v-Baichuan { background: rgba(220,38,38,0.2); color: #dc2626; }
.v-Xiaomi { background: rgba(255,82,82,0.2); color: #ff5252; }

/* Expand arrow */
.expand-arrow {
  width: 20px; text-align: center;
  color: var(--text-muted); font-size: 12px;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.model-card.expanded .expand-arrow { transform: rotate(180deg); }

/* Watch list section */
.watch-divider {
  margin: 16px 12px 8px;
  border: none;
  border-top: 2px dashed var(--border);
  position: relative;
}
.watch-divider::after {
  content: '待观察新模型 · 观察期7天';
  position: absolute;
  top: -11px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--text-dim);
  background: var(--bg);
  padding: 0 12px;
  white-space: nowrap;
}
.model-card.watch-list {
  border-style: dashed;
  border-color: var(--accent);
  opacity: 0.92;
}
.model-card.watch-list.is-new {
  border-color: var(--changed-border);
  border-style: dashed;
}
.watch-badge {
  font-size: 9px; font-weight: 700;
  padding: 2px 6px; border-radius: 3px;
  background: rgba(88,166,255,0.2); color: var(--accent);
  margin-left: 4px;
  animation: none;
}
.watch-days {
  font-size: 10px; color: var(--text-dim);
  margin-top: 4px;
  padding: 4px 8px;
  background: rgba(88,166,255,0.06);
  border-radius: 6px;
  display: inline-flex; align-items: center; gap: 4px;
}
.watch-days .countdown { color: var(--accent); font-weight: 700; }
.watch-days .auto-promote { color: var(--green); font-size: 9px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 13px;
}
.empty-state .emoji { font-size: 32px; opacity: 0.4; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="header">
  <h1><span class="emoji">🐱🦞</span> TokenFlow 热门模型价格监控</h1>
  <div class="meta">
    <span class="dot"></span>
    <span id="updateTime">更新于 --</span>
    <span>·</span>
    <span id="modelCount">--个热门模型</span>
    <span>·</span>
    <span id="platformCount">--个平台渠道</span>
  </div>
</div>

<div id="changeBannerContainer"></div>

<div class="tabs" id="tabs">
  <div class="tab active" data-filter="all">全部</div>
  <div class="tab" data-filter="国际">国际模型</div>
  <div class="tab" data-filter="国内">国内模型</div>
  <div class="tab" data-filter="旗舰">旗舰</div>
  <div class="tab" data-filter="闭源">闭源</div>
  <div class="tab" data-filter="开源">开源</div>
  <div class="tab tab-coding" data-filter="coding">💻 Coding</div>

/* ========== 排序优先级 ========== */
const TIER_ORDER = { '旗舰': 1, '极致': 1, '主力': 2, '新版': 2, '编程': 2, '中端': 3, '高端': 3, '轻量': 4, '高效': 4, '免费/普惠': 5 };
function tierRank(t) { return TIER_ORDER[t] || 3; }

function sortInCategory(arr, primaryLabel) {
  return arr.slice().sort(function(a, b) {
    // Video cards: 按 region 国内优先
    if (a.categories && a.categories.indexOf('video') >= 0 && b.categories && b.categories.indexOf('video') >= 0) {
      const ar = a.region === '国内' ? 0 : 1;
      const br = b.region === '国内' ? 0 : 1;
      if (ar !== br) return ar - br;
    }
    // tier 优先级
    const tr = tierRank(a.tier) - tierRank(b.tier);
    if (tr !== 0) return tr;
    // 新增在末尾
    const an = a._is_new ? 1 : 0;
    const bn = b._is_new ? 1 : 0;
    if (an !== bn) return an - bn;
    // 价格升序
    const ap = a.output_usd || a.output_cny || 0;
    const bp = b.output_usd || b.output_cny || 0;
    return ap - bp;
  });
}

function fmtPrice(v) {
  if (v === null || v === undefined || v === '') return '-';
  if (typeof v === 'number') return v.toFixed(2);
  return v;
}

function discountTag(d) {
  if (d === null || d === undefined) return '<span class="discount-tag tag-gray">N/A</span>';
  if (d > 1) return '<span class="discount-tag tag-red">' + (d*100).toFixed(0) + '%</span>';
  if (d <= 0.55) return '<span class="discount-tag tag-green">' + (d*100).toFixed(0) + '%</span>';
  if (d <= 0.7) return '<span class="discount-tag tag-yellow">' + (d*100).toFixed(0) + '%</span>';
  return '<span class="discount-tag tag-blue">' + (d*100).toFixed(0) + '%</span>';
}

/* ========== 价格单位 ========== */
function billingUnitText(m) {
  const b = m.billing_unit || '1M_tokens';
  if (b === 'per_second') return '1 second (按秒)';
  if (b === 'per_generation') return 'per generation (按次)';
  return '1M tokens';
}

function getBasePrices(model) {
  if (model.region === '国内' && model.input_cny) {
    return { in: model.input_cny, out: model.output_cny, cur: '¥' };
  }
  return { in: model.input_usd, out: model.output_usd, cur: '$' };
}

function calcPlatformPrice(model, discount) {
  if (discount === null || discount === undefined) return '-';
  const base = getBasePrices(model);
  return base.cur + (base.in * discount).toFixed(2) + '/' + base.cur + (base.out * discount).toFixed(2);
}

function findBestPlatform(model) {
  let best = null;
  let bestDiscount = Infinity;
  DATA.platforms.forEach(p => {
    const pdata = model.platforms[p.id] || {};
    const d = pdata.discount;
    if (d !== null && d !== undefined && d <= 1 && d < bestDiscount) {
      bestDiscount = d;
      best = { platform: p, discount: d };
    }
  });
  return best;
}

    if (!meta) return '';

    if (c === 'video' || c === 'coding') {
      const title = (model.category_reason || '').replace(/"/g, '&quot;');
      return '<span class="cat-badge cat-' + c + '" title="' + title + '">' + meta.icon + ' ' + meta.name + '</span>';
    } else {

      return '<span class="cat-badge cat-' + c + '" title="' + title + '">' + meta.icon + ' ' + meta.name + '</span>';
    }
  }).join('');
}

function renderChangeBanner() {

  const newModelCount = (c.new_models || []).length;
  const newPlatformCount = (c.new_platforms || []).length;

  let detailHtml = '';

  if (changedCount > 0) {

  if (!detailHtml) {

  container.innerHTML = '' +

  var dashIdx = model.id.indexOf('-');
  var familyName = dashIdx >= 0 ? model.id.substring(0, dashIdx) : model.id;
  var versionName = dashIdx >= 0 ? model.id.substring(dashIdx + 1) : '';

  // Find best platform (text models only)
  let bestHtml = '';
  if (!isVideo) {
    const best = findBestPlatform(model);
    if (best) {
      bestHtml = '' +
        '<div class="mc-best-row">' +
          '<span class="best-icon">💰</span>' +
          '<span class="best-label">最低渠道</span>' +
          '<span class="best-channel">' + best.platform.name + '</span>' +
          '<span class="best-discount">' + (best.discount * 100).toFixed(0) + '%</span>' +
          '<span class="best-price">' + calcPlatformPrice(model, best.discount) + '</span>' +
          '<span class="expand-hint">点击查看全部 ▼</span>' +
        '</div>';
    }
  }

  // Check if this model has changed prices
  const changedFields = model._changed_fields || {};
  const priceChanged = changedFields.input || changedFields.output;

  // Platform rows
  let platformRows;
  if (isVideo) {
    // Video tier table + connected-platform discount table
    let tierHtml = '';
    const tiers = model.tiers || [];
    if (tiers.length > 0) {
      tierHtml += '<div class="model-note" style="color:var(--cat-video);background:rgba(247,120,186,0.08)">🎬 ' + (model.ranking || '视频生成') + (model.native_audio ? ' · 🔊 原生音频' : '') + ' · 最高 ' + (model.max_resolution || '-') + (model.max_duration_seconds ? ' / ' + model.max_duration_seconds + 's' : '') + '</div>';
      tierHtml += '<table class="video-tier-table">' +
        '<thead><tr><th>档位</th><th>分辨率</th><th>时长</th><th style="text-align:right">CNY</th><th style="text-align:right">USD</th></tr></thead>' +
        '<tbody>';
      tiers.forEach(function(t) {
        tierHtml += '<tr>' +
          '<td style="color:var(--text)">' + (t.name || '-') + '</td>' +
          '<td>' + (t.resolution || '-') + '</td>' +
          '<td>' + (t.duration_range || '-') + '</td>' +
          '<td style="text-align:right">' + (t.price_cny != null ? '¥' + t.price_cny.toFixed(2) : '-') + '</td>' +
          '<td style="text-align:right">' + (t.price_usd != null ? '$' + t.price_usd.toFixed(3) : '-') + '</td>' +
          '</tr>';
      });
      tierHtml += '</tbody></table>';
    }

    // Connected-platform discount table (only platforms with discount data)
    const pfDict = model.platforms || {};
    const vPlats = [];
    DATA.platforms.forEach(function(p) {
      const pd = pfDict[p.id];
      if (pd && pd.discount !== null && pd.discount !== undefined) {
        vPlats.push({ id: p.id, name: p.name, data: pd });
      }
    });
    // Also include video-specific OEM channels not in the 12-platform list (e.g. minimax-api, kling-api)
    Object.keys(pfDict).forEach(function(pid) {
      if (!DATA.platforms.some(function(p) { return p.id === pid; })) {
        const pd = pfDict[pid];
        if (pd && pd.discount !== null && pd.discount !== undefined) {
          vPlats.push({ id: pid, name: pid, data: pd });
        }
      }
    });

    let platHtml = '';
    if (vPlats.length > 0) {
      // Find best discount (< 1.0)
      let bestId = null, bestD = 1.0;
      vPlats.forEach(function(v) {
        if (v.data.discount < bestD) { bestD = v.data.discount; bestId = v.id; }
      });
      const unitCn = model.billing_unit === 'per_generation' ? 'CNY/次' : 'CNY/秒';
      const unitUs = model.billing_unit === 'per_generation' ? 'USD/次' : 'USD/秒';
      platHtml += '<div class="vp-divider">渠道折扣 · 已对接 ' + vPlats.length + ' 家</div>';
      platHtml += '<table class="video-plat-table">' +
        '<thead><tr><th>平台</th><th>折扣</th><th style="text-align:right">' + unitCn + '</th><th style="text-align:right">' + unitUs + '</th></tr></thead>' +
        '<tbody>';
      vPlats.forEach(function(v) {
        const d = v.data.discount;
        const isOem = Math.abs(d - 1) < 0.0001;
        const isBest = v.id === bestId && !isOem;
        const pc = v.data.price_cny;
        const pu = v.data.price_usd;
        platHtml += '<tr' + (isBest ? ' class="vp-best-row"' : '') + '>' +
          '<td>' + v.name +
            (isOem ? '<span class="vp-oem-tag">出厂价</span>' : '') +
            (isBest ? '<span class="vp-best-tag">💰最优</span>' : '') + '</td>' +
          '<td class="' + (isBest ? 'vp-best' : '') + '">' + (d * 100).toFixed(0) + '%' + '</td>' +
          '<td style="text-align:right">' + (pc != null ? '¥' + Number(pc).toFixed(2) : '-') + '</td>' +
          '<td style="text-align:right">' + (pu != null ? '$' + Number(pu).toFixed(3) : '-') + '</td>' +
          '</tr>';
      });
      platHtml += '</tbody></table>';
    }
    platformRows = tierHtml + platHtml;
  } else {
    // Text mode price table
    const best = findBestPlatform(model);
    platformRows = DATA.platforms.map(p => {
      const pdata = model.platforms[p.id] || {};
      const d = pdata.discount;
      const priceStr = calcPlatformPrice(model, d);
      const isBest = best && best.platform.id === p.id;
      const isChanged = changedFields.platforms && changedFields.platforms[p.id];

      let rowClass = '';
      if (isBest) rowClass = 'best-row';
      else if (isChanged) rowClass = 'changed-row';

      let priceClass = '';
      if (isChanged) priceClass = 'changed-cell';

      return '' +
        '<tr class="' + rowClass + '">' +
          '<td class="platform-name">' + p.name + (isChanged ? ' <span style="color:var(--changed);font-size:9px">▲</span>' : '') + '</td>' +
          '<td>' + discountTag(d) + '</td>' +
          '<td style="text-align:right" class="' + priceClass + '">' + priceStr + '</td>' +
        '</tr>';
    }).join('');
  }

  const noteHtml = model.note ? '<div class="model-note">⚠️ ' + model.note + '</div>' : '';

  // Validation (text only)
  const priceMissing = !isVideo && (base.in === null || base.in === undefined || base.in === 0 ||
                       base.out === null || base.out === undefined || base.out === 0);
  const oemFixInfo = changedFields.oem_price_fix || changedFields.oem_price_missing || changedFields.oem_price_verified;
  const hasPriceMismatch = !!changedFields.oem_price_fix;

  // Platform count (text only)
  let allNa = false;
  let validPlatformCount = 0;
  if (!isVideo) {
    validPlatformCount = DATA.platforms.filter(p => {
      const pdata = model.platforms[p.id] || {};
      return pdata.discount !== null && pdata.discount !== undefined;
    }).length;
    allNa = validPlatformCount === 0;
  }

  // Alert badges
  let alertBadges = '';
  let alertCardClass = '';
  if (priceMissing) {
    alertBadges += '<span class="alert-badge price-missing">⚠️出厂价缺失</span>';
    alertCardClass = 'has-alert';
  }
  if (hasPriceMismatch) {
    alertBadges += '<span class="alert-badge price-mismatch">⚠️价格已修正</span>';
    alertCardClass = 'has-alert';
  }
  if (allNa && !priceMissing) {
    alertBadges += '<span class="alert-badge all-na">⚠️全渠道N/A</span>';
    if (!alertCardClass) alertCardClass = 'has-alert';
  }

  let validationNote = '';
  if (oemFixInfo) {
    if (changedFields.oem_price_fix) {
      const fix = changedFields.oem_price_fix;
      validationNote = '<div class="model-note" style="color:#ff4444">🔧 价格修正: ' + (fix.old || fix.old_cny || '') + ' → ' + (fix.new || fix.new_cny || '') + ' (' + (fix.reason || '') + ')</div>';
    } else if (changedFields.oem_price_missing) {
      validationNote = '<div class="model-note" style="color:#ff4444">⚠️ 出厂价缺失: ' + (changedFields.oem_price_missing.reason || '') + '</div>';
    } else if (changedFields.oem_price_verified) {
      const v = changedFields.oem_price_verified;
      if (v.sales_note && v.sales_note !== '一致') {
        validationNote = '<div class="model-note" style="color:#ff6600">ℹ️ 价格校验: ' + v.sales_note + '</div>';
      }
    }
  }

  const priceClass = priceMissing ? 'price-main price-warn' : (priceChanged ? 'price-main changed' : 'price-main');

  // Category reason block (inside expanded card) — only for non-coding/video
  // categories (coding/video show a persistent subtitle in the header instead)
  const reasonText = (model.category_reason || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const cats = model.categories || [];
  const hasCvCat = isVideo || cats.indexOf('coding') >= 0;
  const catReasonBlock = (reasonText && !hasCvCat) ? '' +
    '<div class="cat-reason">' +
      '<span class="cr-label">💡 分类依据</span>' + reasonText +
    '</div>' : '';

  // Persistent category reason subtitle (card header, coding/video models)
  let catSubtitle = '';
  if (hasCvCat && model.category_reason) {
    const fullTitle = String(model.category_reason).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    let short = String(model.category_reason);
    if (short.length > 80) short = short.substring(0, 80) + '…';
    short = short.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    catSubtitle = '' +
      '<div class="mc-cat-reason' + (isVideo ? ' is-video-reason' : '') + '" title="' + fullTitle + '">' +
        '<span class="mcr-label">📌 加标签理由</span>' + short +
      '</div>';
  }

  // Build category badge HTML
  const catBadges = renderCategoryBadges(model);

  return '' +
    '<div class="' + finalCardClass + (alertCardClass ? ' ' + alertCardClass : '') + '" data-region="' + model.region + '" data-tier="' + model.tier + '" data-open="' + model.open + '" data-id="' + model.id + '" data-isnew="' + (isNew ? '1' : '0') + '" data-categories="' + dataCats + '">' +
      '<div class="mc-header" onclick="toggleCard(this)">' +
        '<div class="mc-top-row">' +
          '<div class="mc-left">' +
            '<div class="mc-left-top">' +
              '<span class="vendor-badge ' + vendorClass + '">' + model.vendor_cn + '</span>' +
              '<span class="model-family">' + familyName + '</span>' +
              catBadges +
              newBadge +
              alertBadges +
            '</div>' +
            '<div class="mc-left-bottom">' +
              '<span class="model-tier">' + model.tier + '</span>' +
              '<span class="model-version">' + versionName + '</span>' +
            '</div>' +
            catSubtitle +
          '</div>' +
          '<div class="mc-right">' +
            '<div class="' + priceClass + '">' + base.cur + fmtPrice(base.in) + '<span style="color:var(--text-muted);font-size:11px"> / </span>' + base.cur + fmtPrice(base.out) + '</div>' +
            '<div class="price-unit">出厂价 输入/输出 · ' + billingUnitText(model) + '</div>' +
          '</div>' +
          '<div class="expand-arrow">▼</div>' +
        '</div>' +
        (bestHtml || '') +
      '</div>' +
      '<div class="mc-body">' +
        catReasonBlock +
        (isVideo ? platformRows : (
          '<table class="price-table">' +
            '<thead><tr><th>渠道</th><th>折扣</th><th style="text-align:right">实际价格</th></tr></thead>' +
            '<tbody>' + platformRows + '</tbody>' +
          '</table>'
        )) +
        noteHtml +
        validationNote +
      '</div>' +
    '</div>';
}

/* ========== Watch 卡片渲染 ========== */
function renderWatchModel(model, idx) {
  const base = getBasePrices(model);
  const vendorClass = 'v-' + model.vendor;
  const isNew = model._is_new === true;
  const cardClass = isNew ? 'model-card watch-list is-new' : 'model-card watch-list';
  const newBadge = isNew ? '<span class="new-badge">NEW</span>' : '';

  var dashIdx = model.id.indexOf('-');
  var familyName = dashIdx >= 0 ? model.id.substring(0, dashIdx) : model.id;
  var versionName = dashIdx >= 0 ? model.id.substring(dashIdx + 1) : '';

  const addDate = model._added_to_watch || model._added_date || DATA.update_time.split(' ')[0];
  const promoteDate = model._auto_promote_date || '';
  const addTime = new Date(addDate.replace(/-/g, '/'));
  const nowTime = new Date();
  const watchDays = Math.max(0, Math.floor((nowTime - addTime) / (1000*60*60*24)));
  const daysLeft = promoteDate ? Math.max(0, Math.ceil((new Date(promoteDate.replace(/-/g, '/')) - nowTime) / (1000*60*60*24))) : 7 - watchDays;

  const best = findBestPlatform(model);
  const bestHtml = best ? '' +
    '<div class="mc-best-row">' +
      '<span class="best-icon">💰</span>' +
      '<span class="best-label">最低渠道</span>' +
      '<span class="best-channel">' + best.platform.name + '</span>' +
      '<span class="best-discount">' + (best.discount * 100).toFixed(0) + '%</span>' +
      '<span class="best-price">' + calcPlatformPrice(model, best.discount) + '</span>' +
      '<span class="expand-hint">点击查看全部 ▼</span>' +
    '</div>' : '';

  const platformRows = DATA.platforms.map(p => {
    const pdata = model.platforms[p.id] || {};
    const d = pdata.discount;
    const priceStr = calcPlatformPrice(model, d);
    const isBest = best && best.platform.id === p.id;
    let rowClass = isBest ? 'best-row' : '';
    return '' +
      '<tr class="' + rowClass + '">' +
        '<td class="platform-name">' + p.name + '</td>' +
        '<td>' + discountTag(d) + '</td>' +
        '<td style="text-align:right">' + priceStr + '</td>' +
      '</tr>';
  }).join('');

  const noteHtml = model.note ? '<div class="model-note">⚠️ ' + model.note + '</div>' : '';
  const watchDaysHtml = '' +
    '<div class="watch-days">' +
      '⏳ 已观察 <span class="countdown">' + watchDays + '</span> 天' +
      (daysLeft > 0 ? ' · 剩余 <span class="countdown">' + daysLeft + '</span> 天' : '') +
      (daysLeft <= 0 ? ' <span class="auto-promote">→ 下次周更纳入正式清单</span>' : '') +
    '</div>';

  return '' +
    '<div class="' + cardClass + '" data-region="' + model.region + '" data-tier="' + model.tier + '" data-open="' + model.open + '" data-id="' + model.id + '" data-isnew="' + (isNew ? '1' : '0') + '">' +
      '<div class="mc-header" onclick="toggleCard(this)">' +
        '<div class="mc-top-row">' +
          '<div class="mc-left">' +
            '<div class="mc-left-top">' +
              '<span class="vendor-badge ' + vendorClass + '">' + model.vendor_cn + '</span>' +
              '<span class="model-family">' + familyName + '</span>' +
              renderCategoryBadges(model) +
              newBadge +
            '</div>' +
            '<div class="mc-left-bottom">' +
              '<span class="model-tier">' + model.tier + '</span>' +
              '<span class="model-version">' + versionName + '</span>' +
              '<span class="watch-badge">👁️ 观察中</span>' +
            '</div>' +
          '</div>' +
          '<div class="mc-right">' +
            '<div class="price-main">' + base.cur + fmtPrice(base.in) + '<span style="color:var(--text-muted);font-size:11px"> / </span>' + base.cur + fmtPrice(base.out) + '</div>' +
            '<div class="price-unit">出厂价 输入/输出 · ' + billingUnitText(model) + '</div>' +
          '</div>' +
          '<div class="expand-arrow">▼</div>' +
        '</div>' +
        bestHtml +
      '</div>' +
      '<div class="mc-body">' +
        (model.category_reason ? '<div class="cat-reason"><span class="cr-label">💡 分类依据</span>' + model.category_reason.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' : '') +
        '<table class="price-table">' +
          '<thead><tr><th>渠道</th><th>折扣</th><th style="text-align:right">实际价格</th></tr></thead>' +
          '<tbody>' + platformRows + '</tbody>' +
        '</table>' +
        watchDaysHtml +
        noteHtml +
      '</div>' +
    '</div>';
}

/* ========== 分类说明卡 (Coding/Video 时展示) ========== */
function renderCategoryExplainer(filter) {
  if (filter === 'coding') {
    return '' +
      '<div class="category-explainer">' +
        '<div class="ce-title">💻 Coding 热门子项</div>' +
        '<div>收录依据：①厂商官方定位为编程（SWE-Bench Verified / Terminal-Bench 等基准分高）；②模型 tier 标签为「编程」；③开源生态中代码任务主力推荐。</div>' +
        '<div class="ce-sort"><b>排序规则:</b> 旗舰 > 主力 > 中端 > 轻量 → 新增模型置末 → 价格升序。同 tier 时按输出价由低到高。</div>' +
      '</div>';
  }
  if (filter === 'video') {
    return '' +
      '<div class="category-explainer" style="border-color:rgba(247,120,186,0.25);background:rgba(247,120,186,0.05)">' +
        '<div class="ce-title" style="color:var(--cat-video)">🎬 视频生成子项</div>' +
        '<div>收录依据：①国内主流视频生成 API（Seedance / Wan / CogVideoX / HY-Video / Kling / MiniMax-H3）；②国际厂商旗舰（Sora 2 / Veo 3.1）。⚠️ 注意：视频模型按 <b>秒 / 按次</b> 计费，与文本 Token 模型不可直接比较单价位。</div>' +
        '<div class="ce-sort"><b>排序规则:</b> 国内优先 → 旗舰 > 主力 > 轻量 → 价格升序。卡片中显示最低→最高档位的 CNY/USD。</div>' +
      '</div>';
  }
  return '';
}

/* ========== 主渲染函数 ========== */
function render(filter) {
  filter = filter || 'all';
  const list = document.getElementById('modelList');
  const explainerEl = document.getElementById('categoryExplainerContainer');
  explainerEl.innerHTML = renderCategoryExplainer(filter);

  let models = DATA.hot_models;
  const watchModels = DATA.watch_list_models || [];

  if (filter === 'watch') {
    const watchIntl = watchModels.filter(m => m.region === '国际');
    const watchDom = watchModels.filter(m => m.region === '国内');
    let html = '';
    if (watchModels.length === 0) {
      html = '<div class="empty-state"><div class="emoji">👁️</div>暂无待观察模型</div>';
    } else {
      if (watchIntl.length) {
        html += '<div class="section-title">🌐 国际 · 待观察 <span class="new-count">' + watchIntl.length + '</span></div>';
        html += watchIntl.map(renderWatchModel).join('');
      }
      if (watchDom.length) {
        html += '<div class="section-title">🇨🇳 国内 · 待观察 <span class="new-count">' + watchDom.length + '</span></div>';
        html += watchDom.map(renderWatchModel).join('');
      }
    }
    list.innerHTML = html;
    updateSummary();
    return;
  }

  // ========== Coding 子项 ==========
  if (filter === 'coding') {
    const codingModels = models.filter(m => (m.categories || []).indexOf('coding') >= 0);
    const sorted = sortInCategory(codingModels);
    const intl = sorted.filter(m => m.region === '国际');
    const dom = sorted.filter(m => m.region === '国内');

    let html = '';
    if (intl.length) {
      html += '<div class="section-title">🌐 国际 Coding 模型 <span class="new-count">' + intl.length + '</span></div>';
      html += intl.map(renderModel).join('');
    }
    if (dom.length) {
      html += '<div class="section-title">🇨🇳 国内 Coding 模型 <span class="new-count">' + dom.length + '</span></div>';
      html += dom.map(renderModel).join('');
    }
    if (sorted.length === 0) {
      html = '<div class="empty-state"><div class="emoji">💻</div>暂无 Coding 子项收录模型</div>';
    }
    list.innerHTML = html;
    updateSummary();
    return;
  }

  // ========== Video 子项 ==========
  if (filter === 'video') {
    const videoModels = models.filter(m => (m.categories || []).indexOf('video') >= 0);
    const sorted = sortInCategory(videoModels, 'video');
    const intl = sorted.filter(m => m.region === '国际');
    const dom = sorted.filter(m => m.region === '国内');

    let html = '';
    if (dom.length) {
      html += '<div class="section-title">🇨🇳 国内视频模型 <span class="new-count">' + dom.length + '</span></div>';
      html += dom.map(renderModel).join('');
    }
    if (intl.length) {
      html += '<div class="section-title">🌐 国际视频模型 <span class="new-count">' + intl.length + '</span></div>';
      html += intl.map(renderModel).join('');
    }
    if (sorted.length === 0) {
      html = '<div class="empty-state"><div class="emoji">🎬</div>暂无视频子项收录模型</div>';
    }
    list.innerHTML = html;
    updateSummary();
    return;
  }

  // ========== 全部/区域/tier/open 过滤 ==========
  if (filter !== 'all') {
    if (filter === 'new') {
      models = models.filter(m => m._is_new === true);
    } else {
      models = models.filter(m =>
        m.region === filter || m.tier === filter || m.open === filter
      );
    }
  }

  // 分离视频 / 文本
  const textModels = models.filter(m => (m.categories || []).indexOf('video') < 0);
  const videoModels = models.filter(m => (m.categories || []).indexOf('video') >= 0);

  const intl = textModels.filter(m => m.region === '国际');
  const dom = textModels.filter(m => m.region === '国内');
  const vIntl = videoModels.filter(m => m.region === '国际');
  const vDom = videoModels.filter(m => m.region === '国内');

  const newIntlCount = intl.filter(m => m._is_new).length;
  const newDomCount = dom.filter(m => m._is_new).length;

  let html = '';
  if (intl.length) {
    html += '<div class="section-title">🌐 国际文本模型';
    if (newIntlCount > 0) html += ' <span class="new-count">+' + newIntlCount + ' 新增</span>';
    html += '</div>';
    html += intl.map(renderModel).join('');
  }
  if (dom.length) {
    html += '<div class="section-title">🇨🇳 国内文本模型';
    if (newDomCount > 0) html += ' <span class="new-count">+' + newDomCount + ' 新增</span>';
    html += '</div>';
    html += dom.map(renderModel).join('');
  }

  // 视频部分（仅在不过滤 watch 时显示）
  if (filter !== 'new' && (vDom.length || vIntl.length)) {
    html += '<hr class="watch-divider" style="border-top:2px dashed rgba(247,120,186,0.3)">' +
            '<div style="position:relative;height:0">' +
            '<div style="position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--cat-video);background:var(--bg);padding:0 12px;white-space:nowrap">🎬 视频生成模型 · 按秒/按次计费</div>' +
            '</div>';
    if (vDom.length) {
      html += '<div class="section-title" style="color:var(--cat-video)">🇨🇳 国内视频模型 <span style="font-size:10px">' + vDom.length + ' 个</span></div>';
      html += vDom.map(renderModel).join('');
    }
    if (vIntl.length) {
      html += '<div class="section-title" style="color:var(--cat-video)">🌐 国际视频模型 <span style="font-size:10px">' + vIntl.length + ' 个</span></div>';
      html += vIntl.map(renderModel).join('');
    }
  }

  // Watch list
  if (filter !== 'new' && watchModels.length > 0) {
    const watchIntl = watchModels.filter(m => m.region === '国际');
    const watchDom = watchModels.filter(m => m.region === '国内');
    if (watchIntl.length || watchDom.length) {
      html += '<hr class="watch-divider">';
    }
    if (watchIntl.length) {
      html += '<div class="section-title">🌐 国际 · 待观察 <span style="font-size:10px;color:var(--accent);">+观察期7天</span></div>';
      html += watchIntl.map(renderWatchModel).join('');
    }
    if (watchDom.length) {
      html += '<div class="section-title">🇨🇳 国内 · 待观察 <span style="font-size:10px;color:var(--accent);">+观察期7天</span></div>';
      html += watchDom.map(renderWatchModel).join('');
    }
  }

  if (!html) {
    html = '<div class="empty-state"><div class="emoji">🔍</div>暂无匹配模型</div>';
  }

  list.innerHTML = html;
  updateSummary();
}

function updateSummary() {
  const allDiscounts = [];
  const channelWins = {};
  DATA.hot_models.forEach(m => {
    // 跳过视频模型，因计费单位不同
    if ((m.categories || []).indexOf('video') >= 0) return;
    const best = findBestPlatform(m);
    if (best) {
      allDiscounts.push(best.discount);
      const pname = best.platform.name;
      channelWins[pname] = (channelWins[pname] || 0) + 1;
    }
  });
  if (allDiscounts.length > 0) {
    const minD = Math.min.apply(null, allDiscounts);
    const avgD = allDiscounts.reduce(function(a,b){return a+b;}, 0) / allDiscounts.length;
    document.getElementById('minDiscount').textContent = (minD * 100).toFixed(0) + '%';
    document.getElementById('avgDiscount').textContent = (avgD * 100).toFixed(0) + '%';
  }
  let topChannel = '--';
  let topCount = 0;
  Object.keys(channelWins).forEach(function(name) {
    if (channelWins[name] > topCount) { topChannel = name; topCount = channelWins[name]; }
  });
  document.getElementById('bestChannel').textContent = topChannel;
}

function toggleCard(el) {
  el.parentElement.classList.toggle('expanded');
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    render(tab.dataset.filter);
  });
});

document.getElementById('updateTime').textContent = '更新于 ' + DATA.update_time;
const totalText = DATA.hot_models.filter(m => (m.categories || []).indexOf('video') < 0).length;
const totalVideo = DATA.hot_models.filter(m => (m.categories || []).indexOf('video') >= 0).length;
document.getElementById('modelCount').textContent = totalText + '个文本 + ' + totalVideo + '个视频' + ((DATA.watch_list_models || []).length > 0 ? ' +' + DATA.watch_list_models.length + '观察' : '');
document.getElementById('platformCount').textContent = DATA.platforms.length + '个平台渠道';
renderChangeBanner();
render();
</script>
